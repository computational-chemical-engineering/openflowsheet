(SCHEMA_BASE, _validator, ...) and the SCHEMA_DIR re-export, which the ADR does not list. Expected \
codehealth arch --depth 4: base 5 violations / 4 cycles / 14 cycle edges, after 5 / 4 / 14 (the \
import edge application.types -> schema_check stays)."""
