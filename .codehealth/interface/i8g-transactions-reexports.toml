public-API tier and the __all__ list is the listed change (STOP 1 ruling). Expected codehealth \
arch --depth 4 (measured at this base and on the step applied to it): base 4 violations / 3 \
cycles / 12 cycle edges, after 4 / 3 / 12 (imports 3996 -> 3989; the edge transactions -> \
revision_edits goes, which was neither a violation nor on a cycle). Layer config: none."""
