_unique_members and _file_document. get_stream_table takes (job_id, query): the frozen \
dataclass StreamTableQuery (pointer, depth, cursor, limit, display_units; no defaults, no \
__post_init__), defined in artifact_service.py, and its body reads query.<field> where it read the \
parameter (orchestrator ruling of 2026-11-17 on run 18's debt refusal, brief S19-W4-19). Statements move unchanged except the receiver (self._x( -> \
self._core.x( for the core members, self.files_root -> self._core.files_root, self._x( -> self.x( for \
the renamed members, query.<field> in get_stream_table); checked by AST comparison of every function of local.py at the base. \
LocalApplication keeps every public method name and signature (the three artifact methods become \
one-line delegations with their docstrings; get_stream_table's body builds the StreamTableQuery \
from its keyword arguments; its default depth reads \
artifact_service.STREAM_TABLE_DEPTH); the facade methods of the services not yet moved call \
self._artifacts.job, display_units and artifact_path; OPERATIONS untouched. Callers follow: \
tests/test_msg_surfaces.py patches MAX_LISTED_MEMBERS where _missing_member now reads it \
(artifact_service; Q-F5) and tests/test_st_operation.py imports STREAM_TABLE_DEPTH from its home. No \
string literal is added or removed. Expected codehealth arch --depth 4 (measured on the step applied \
to this base): 0 / 0 / 0 -> 0 / 0 / 0 (imports 4151 -> 4168, files 327 -> 328). Layer config after \
the step (separate commit): application-layers gains application.artifact_service between \
application.validation_service and application.revision_service."""
