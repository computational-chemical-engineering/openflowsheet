# ADR 0076 I-12a (W4 run 15, brief S19-W4-15): application/types.py is removed; its names go to six
# new modules by concept. `codehealth gate --mode interface` reads this plan from the plan commit.
id = "i12a-types-split"
approved_by = "Frank Peters, 2026-11-14, ADR 0076 accepted (Decision Desk ofs-adr0076-accept)"
reason = """ADR 0076 I-12a (S17 D2) with the R-1044 addendum: types.py is removed and its statements \
move verbatim, in their order, to six new modules: documents.py (EVENT_COMMON_MEMBERS, the event-common \
and consumer schema helpers, published_schemas, checked, validate_inline), transaction_types.py \
(EditOperation, TransactionStatus, error_document, error_build, Edit, Change, ChangeSet, DiffMember, \
DiffChange, DiffElement, SemanticDiff, TransactionResult), job_requests.py (DEFAULT_SOLVE_POLICY_ID, \
Budgets ... OptimizeBody, JobBody, JobRequest, normalize_job_request, request_sha256), job_records.py \
(VerificationStatus, SolvePath, ArtifactRef, Progress, JobEnding, EffectiveBudgets, Job, JobEvent, \
RunFailure, RunResult, JobResult), policy_types.py (Right, RIGHTS, LOCAL_OWNER_PRINCIPAL, Limits, \
CapabilityReference, ExecutorSettings, ProjectPolicy, ReplayPolicy), inspection_types.py (SubmitResult, \
JobWait, ServerInfo, ProjectSummary, ModelRegistryView, MessageEntry, RevisionSummary, AuditOutcome, \
AuditOrder, AuditRecord, CapabilityDescriptor, CapabilityPage, AdmissionPair, AdmissionReport). Run 13's \
logged choices apply: vocabulary constants go with their first user in the ADR list's order; \
_checked and _event_common_validator become public checked and event_common_validator in documents \
(R-1044); _error_document and _error_build (users: transaction_types and job_records) go to the lower \
one, transaction_types, as public error_document and error_build. Private helpers with one user move \
with it under their own names (_event_common_schema, _consumer_event_schema -> documents; \
_validation_report_build -> transaction_types; _BODY_TYPES -> job_requests; _failure_document, \
_replay_report_build, _display_units_build -> job_records); no module outside types.py imports them. \
Pure move: statements AST-identical after the four renames, no signature change, no alias, no \
__getattr__, no re-export; strings and arithmetic unchanged; no string literal is removed (module \
docstrings only). Import graph: documents <- transaction_types <- job_records; documents <- job_requests \
<- job_records <- inspection_types; documents <- policy_types <- inspection_types; errors <- \
transaction_types, job_records (RunResult under TYPE_CHECKING in errors and jobs/model). NLOC \
(codehealth scan): types.py 1392 -> documents 60, transaction_types 222, job_requests 255, job_records \
478, policy_types 160, inspection_types 258 (ADR 83, 204, 245, 469, 148, 252; documents smaller since \
I-5, I-5b and I-9 moved its schema names out). Callers follow, import lines only: src application \
modules (admission, authz, bindings/mcp, capabilities, cli, contract, errors, jobs/executor, \
jobs/model, jobs/runner, local, operations, revision_edits, serving, store, store_records) and the \
tests, scripts and benchmarks below (incl. the Python source string in benchmarks/m06/w27/stubs.py); \
text callers README.md, docs-site (api/index, api/replay, api/types, quickstart, first-flowsheet) and \
the five example notebooks follow by the tool's text-caller rule (cce-code-health cf15245). Retargets \
before this plan, outside the gate: 0ca3c762 (_registry, docs ApiError/SolveFailedError to their \
homes) and 7e844e9b (BODY_READERS, the binding allow-lists, the G20 @cache entry -> documents.py). \
patch_noop 265 total, 0 flagged at this base and on the step; no class-member patch on a moved \
class. Expected codehealth arch --depth 4 (measured at this base and on the step): 0 / 0 / 0 -> 0 / \
0 / 0 (imports 4012 -> 4066, files 317 -> 322). Layer config after the step (separate commit): \
application-layers replaces application.types by inspection_types, job_records, job_requests, \
policy_types, transaction_types, then errors, then documents."""
