# Code labels that are not recovery edges, each with the reason.
not_an_edge:
  - label: eo_core:newton
    reason: the primary EO core, not a response to a failure
  - label: eo_recovery:none
    reason: the policy value that turns edge 3 off
  - label: decision:converged
    reason: the contract's success verdict
  - label: decision:terminal
    reason: the contract's terminal verdict. It ends the solve and runs nothing else.
  - label: opening_source:initializer
    reason: attempt 0's opening from the initializer chain's accepted source, the primary path
  - label: ph_route:saturation
    reason: >-
      the primary route for a single flowing component (the two-phase region collapses to
      T_sat), chosen by the state and not after a failure (ph_kernel.py step 2)
  - label: ph_route:bracket
    reason: the primary temperature route
  - label: projection_judged_at:projection
    reason: the primary judgement at the projected state x̃
  - label: initializer_source:compatible_warm_start
    reason: >-
      A policy-chosen initializer source (`T08-warm-v1`, source 2), not a response to a failure.
      T08 build-first spec §B2 "No new fallback": a warm-started solve that fails keeps the
      policy's edges and gains none, so §5.6 is unchanged. Its rejection → next source is E9, which
      carries the rejection producer's label.
