    status: implemented

  - id: D15
    title: Agent workflow (local and remote clients)
    blueprint_ref: "§1 D15"
    packages: [K06, T07]
    minimum_evidence: "In-process scientific use and common transport semantics"
    # The in-process half is delivered: one application layer that a Python caller and the CLI
    # both use, with no network round trip anywhere on the local path. Blueprint §11's three
    # transaction properties are implemented and measured — an expected revision that refuses a
    # stale commit and names both ids, an idempotency key that returns the *original* result
    # rather than a second one, and a change set that applies whole or not at all.
    #
    # Status `implemented`, not `tested`: "common transport semantics" is the second half and
    # it is T07's — there is no HTTP or MCP binding, no job lifecycle, and no authorization
    # model. D15 itself says the binding follows in v0.1, so the absence is the plan and not a
    # gap; it is nevertheless half the requirement.
    tests:
      - tests/test_k06_application.py
    evidence:
      - evidence/K06/cda68cd446be27992051d43422336ad5f9430fe8/manifest.json
    status: implemented

  - id: D16
    title: Draft editing and readiness
    blueprint_ref: "§1 D16"
    packages: [K06, M03]
    minimum_evidence: "Incomplete draft persistence; task-specific closure"
    # Both halves are exercised and one is honest about its depth. An under-specified revision
    # commits and reports `DRAFT` — blueprint D16's "a syntactically valid draft can be
    # committed without being executable", which matters because a tool that refuses to hold an
    # unfinished thought gets worked around and the work then happens with no provenance at
    # all. `DRAFT` and `INVALID` are kept distinct: incomplete is not malformed.
    #
    # Task-specific closure is where the depth is limited, and the report says so in its own
    # output rather than in a footnote: `structural_counts` is null and an `unsupported` check
    # carries blueprint §4.3's matching and Dulmage-Mendelsohn decomposition, so the registered
    # conflicting-heater revision is now rejected at validation with STRUCTURAL_OVER_SPECIFICATION
    # naming the heater and its two specifications. Before T01 it validated READY_FOR_SIMULATION
    # and was refused downstream as UNSUPPORTED_RANK_STRUCTURE, which described the tool rather
    # than the revision.
    #
    # Status `implemented`, not `tested`: M03 owns the optimization closure, which is a
    # different requirement from simulation closure (D16 says so).
    tests:
      - "tests/test_k06_application.py::test_d16_an_incomplete_draft_is_committable"
      - "tests/test_k06_application.py::test_a_status_is_computed_and_there_is_no_way_to_set_one"
      - "tests/test_k06_application.py::test_validation_computes_the_structural_counts"
    evidence:
