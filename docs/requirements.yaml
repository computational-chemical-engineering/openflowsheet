    # above stands as the two-tool outcome ("not met, 2 of 4"). The status and verdict fields are not moved by this
    # citation; whether a release accepts "met where available" is outside S09 (spec §8.5). S09's manifest `evidence/S09/4d4df087...` (`tested`) is cited below.
    verdict: null
