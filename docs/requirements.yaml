  - id: D20
    title: Reproducibility
    blueprint_ref: "§1 D20"
    packages: [K05, T06]
    minimum_evidence: "Structural hashes vs controlled numerical replay"
    # The requirement is the *separation*, and both halves are measured. The structural hash
    # covers ids, policies and outcomes only and is equal on x86-64 and aarch64 — established
    # by CI, because no single machine can establish it. The controlled numerical replay is
    # ADR 0007 D4's mode decision, taken from the environment before anything runs, so a
    # changed dependency cannot reach a comparison at all.
    #
    # The first version of the structural hash covered the environment and the artifact index,
    # and CI produced two different values across architectures while every other R0 field was
    # identical. That was the hash measuring the platform rather than the model; blueprint
    # §8.3 R0 promises structural artifacts identical *on supported platforms*, so an identity
    # that moves with the platform cannot be it. The environment is provenance (ADR 0007 D6)
    # and the artifact index hashes documents containing floats.
    #
    # Status `implemented`, not `tested`: T06 owns the robustness ensemble and the broader
    # replay matrix, and a genuinely clean-environment replay — a fresh container built only
    # from the recorded lock file — is recorded `unsupported` in the manifest rather than
    # claimed.
    tests:
      - tests/test_k05_replay.py
      - tests/test_k05_schemas.py
    evidence:
      - evidence/K05/b0a7fe766c35f6491dfc53ecab3101199d221850/manifest.json
    status: implemented

  - id: A01
    title: Phase-set ownership
    blueprint_ref: "§6.3 [A01] and §7.6 [A01]"
    packages: [K03, T03]
    minimum_evidence: "Same signature across residual/Jacobian trials; restart on update"
    # [A01] is made structural rather than checked: `AttemptContext` is the one object an
    # attempt's calls take their signature from, so residual and Jacobian cannot disagree about
    # it by construction. What is asserted is the consequence -- every event of an attempt
    # carries that attempt's signature -- and the restart, which is OFF-B.
    #
    # One measured subtlety, because it is the kind of thing that looks like a violation: the
    # signature covers the *flash* and only the flash (§9.1). Freezing every stream's regime
    # instead makes the nominal case's one-step landing on the solution a rejected phase change,
    # because the heater outlet flips TWO_PHASE -> LIQUID along that step. The signature is over
    # the selections the residual depends on, not over every selection made anywhere.
    #
    # Status `implemented`, not `tested`: the general rule for deriving a signature from the
    # block-triangular form is T03's.
    tests:
      - "tests/test_k03_attempts.py::test_every_event_of_an_attempt_carries_that_attempts_signature"
      - "tests/test_k03_attempts.py::test_the_signature_is_the_flash_and_only_the_flash"
      - "tests/test_k03_attempts.py::test_the_heater_outlet_regime_is_not_frozen"
      - "tests/test_k03_attempts.py::test_off_b_restarts_across_the_phase_boundary_and_converges"
      - "tests/test_k03_tear.py::test_the_lifted_function_does_not_depend_on_the_pinned_phase_signature"
    evidence:
      - evidence/K03/c806f83fd3fb0e71967235000fb517fc1c26efd4/manifest.json
    status: implemented

