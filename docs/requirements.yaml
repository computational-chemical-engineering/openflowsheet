requirements:
  - id: D01
    title: Meaning of an original numerical core
    blueprint_ref: "§1 D01"
    packages: [K03, T02, T04]
    minimum_evidence: "Explicit plans/attempts; own policy calls interchangeable numerical interfaces"
    # All three halves are K03's, and all three are executable. "Explicit plans": `SolvePlan` is
    # built before any residual is evaluated and `plan_built` is the first event of every trace --
    # a mutation that builds it after the solve, or does not record it, is caught. "Explicit
    # attempts": every attempt opens with a frozen signature and an `AttemptContext`, and the
    # contexts survive on the result, so an attempt can be reconstructed rather than inferred.
    # "Own policy calls interchangeable numerical interfaces": the policy lives in `SolvePolicy`
    # and the only linear algebra is the one ADR 0004 call, behind `solve_linear`.
    #
    # Status `implemented`, not `tested`: T02 and T04 own the rest of the requirement (design
    # specifications and pseudo-transient continuation), and neither exists.
    tests:
      - tests/test_k03_schemas.py
      - tests/test_k03_attempts.py
      - "tests/test_k03_newton.py::test_a_policy_records_the_linear_solver_it_used"
    evidence:
      - evidence/K03/c806f83fd3fb0e71967235000fb517fc1c26efd4/manifest.json
    status: implemented

