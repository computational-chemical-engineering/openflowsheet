# Requirements ledger: requirement -> work package -> test -> evidence -> status.
#
# Authority: docs/blueprint-v3.1.md (architecture) and docs/implementation-plan.md v1.2
# (execution). Requirement rows come from plan §5; gate rows from plan §5.1; package rows
# from plan §4.1-§4.5 with lead/second from the Model column. Titles and blueprint
# references come from blueprint §1 (D01-D20) and the §3.1/§6.3/§7.2/§7.5/§8.1/§9.2/§10/§13.4/§15
# amendment markers (A01-A10, listed in the version 3.1 amendment guide).
#
# Structure is fixed by P00 and validated by schemas/requirements-ledger.schema.json and
# tests/test_requirements_ledger.py. `tests` holds pytest node IDs and `evidence` holds
# evidence/<package>/<commit>/manifest.json paths; both are filled as work lands.
# Statuses use the vocabulary below. No agent sets `reviewed` on its own package.

