  - id: D08
    title: Thermodynamic primitive
    blueprint_ref: "§1 D08"
    packages: [P01, K02, M01, S04, S05, S07, S10]
    minimum_evidence: "Consistent synthetic model and real provider conformance"
    # P01 delivered the synthetic half as an algebraic oracle: h = g - T dg/dT, K from equality
    # of chemical potentials, exact pure-component boiling points, the declared domain failure,
    # zero-component handling, and every registered variant's phase state against Fable's
    # independent 20-digit reference.
    #
    # K02 adds the production half: the capability contract of blueprint §6.1 with every field
    # required, a SYN-001 provider transcribed separately from the oracle, and the six unit
    # models, whose outlets, duties, phase signatures and overall balances agree with the same
    # 20-digit references at all five registered variants. D08's own rule -- a unit requires the
    # capabilities it uses, not a universal tier -- is carried by `PropertyCapabilities` being a
    # description a unit queries rather than a grade it must meet.
    #
    # Status moves to `implemented`, not `tested`: the *real provider conformance* half of the
    # minimum evidence is M01's and does not exist. A synthetic provider conforming to its own
    # contract is not the conformance this requirement asks for, and calling it `tested` would
    # claim M01's work.
    #
    # Design lane, D2, 2026-10-23 (R-614): the premise above no longer holds, so the status moves to
    # `tested`. M01's real-provider evidence exists: `pr-c1-v1` on the same contract, with typed
    # refusals and implementation and data hashes. Its manifest is `tested` and lists D08, and
    # ADR 0026 was accepted on it after the design-lane review. S04 adds `pr-lib-v1`, a second real
    # provider on the contract, whose manifest is `tested` and lists D08. S05 adds `iapws95-v1`
    # (ADR 0045, Accepted): its tests are listed, and its packaging manifest `evidence/S05/01cdeed4...`
    # (WO-S05-5, S05 spec §16, R-616, R-617) is `tested` and lists D08 (the superseded `da829aa...` and
    # `4ac00a0...` are not cited). S07 adds `coolprop-heos-v1` (ADR 0046), an optional provider over
    # CoolProp 8.0.0 for 123 pure fluids: its tests are listed (they run where the `coolprop` extra is
    # installed, as in CI's check job), and its manifest `evidence/S07/7bfab70d...` is `tested` and lists
    # D08. Not claimed:
    # `reviewed` (the manifests' human numerical and process-model review is pending); that the
    # library-only providers `pr-lib-v1`, `iapws95-v1` and `coolprop-heos-v1` are selectable (R-568,
    # R-569, R-594; Frank, C12 2026-10-23); bit-identity of `coolprop-heos-v1` across architectures
    # (agreement within S07 spec §20, R-627); and that `pr-lib-v1` is shipped (`iapws95-v1`'s coefficient file is package
    # data under IAPWS's attribution, R-616).
    #
    # S10 adds `wilson-ig-v1`, a Wilson-liquid / ideal-gas activity-coefficient provider on the same contract, verified
    # on synthetic records against a 50-digit generator and on its real methanol-ethanol-water records against IDAES and
    # DWSIM (S10 spec §7.5, §8; R-700 to R-721). Its tests are listed, and its manifest `evidence/S10/f6f27c3f...`
    # (WO-S10-8) is `tested` and lists D08 and D19. Validation is reported apart (spec §9.6, §17 A4-4, §19):
    # VAL-1 within band, VAL-2 within band (judged per binary, 323.15-333.15 K), VAL-3 not validated within band for
    # the methanol latent heat (+5.72 % against 5 %). Not claimed: `reviewed`; that `wilson-ig-v1` is selectable
    # (library-only, S10.A27); that its records ship (RC-05, RC-06, RC-08 unresolved; Q-F3, Frank's); constant-Lambda
    # extrapolation outside 323.15-333.15 K; individual methanol-ethanol Lambda (§17 A4-2).
    tests:
      - tests/test_syn001_oracle.py::test_a1_identity_by_a_fourth_order_difference
      - tests/test_syn001_oracle.py::test_a2_k_values_equal_the_chemical_potential_form
      - tests/test_syn001_oracle.py::test_a3_k_is_one_at_the_reference_boiling_point
      - tests/test_syn001_oracle.py::test_a3_enthalpy_of_vaporization_at_p_r_is_l_i
      - tests/test_syn001_oracle.py::test_a5_outside_the_declared_domain_raises
      - tests/test_syn001_oracle.py::test_c_absent_component_passes_exact_zeros_through
      - tests/test_syn001_oracle.py::test_c_zero_feed_is_zero_flow_with_undefined_composition
      - tests/test_syn001_oracle.py::test_c_pure_b_at_its_boiling_point_is_classified_liquid
      - tests/test_syn001_oracle.py::test_g_energy_closure
      - tests/test_syn001_oracle.py::test_g_closed_form_total_duty
      - tests/test_syn001_reference_values.py::test_a4_k_values_match_the_reference_grid
      - tests/test_syn001_reference_values.py::test_c_fresh_feed_flash_matches_the_reference
      - tests/test_syn001_reference_values.py::test_e_variant_phase_states_match_the_reference
      - tests/test_k02_syn001_provider.py
      - tests/test_k02_unit_models.py
