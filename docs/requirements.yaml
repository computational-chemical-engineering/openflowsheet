    #
    # K02 adds the production half: the capability contract of blueprint §6.1 with every field
    # required, a SYN-001 provider transcribed separately from the oracle, and the six unit
    # models, whose outlets, duties, phase signatures and overall balances agree with the same
    # 20-digit references at all five registered variants. D08's own rule -- a unit requires the
    # capabilities it uses, not a universal tier -- is carried by `PropertyCapabilities` being a
    # description a unit queries rather than a grade it must meet.
    #
    # Status moves to `implemented`, not `tested`: the *real provider conformance* half of the
    # minimum evidence is M01's and does not exist. A synthetic provider conforming to its own
    # contract is not the conformance this requirement asks for, and calling it `tested` would
