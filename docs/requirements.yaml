  - id: D05
    title: Structural decomposition
    blueprint_ref: "§1 D05"
    packages: [T01, K04, T06]
    minimum_evidence: "Structural and numerical singularity separated"
    # Two different things with two different mechanisms, which is the requirement. *Structural*
    # redundancy is eliminated before any numerics with a certificate (K03 §7, register R-011)
    # and the eliminated rows are still checked at the final state. *Numerical* singularity is
    # the [A08] screen on the unregularized target Jacobian at that state, with a rank-revealing
    # escalation. The triangular fixtures show they cannot be conflated: `U = I - N` is
    # structurally perfect at every size and numerically well conditioned, ill conditioned and
    # rank deficient at n = 16, 32, 64.
    #
    # T01 delivers the structural half: a declaration-traced incidence graph, matching,
    # Dulmage-Mendelsohn, the block-triangular form and the tear, with the certificate now issued
    # from the declaration rather than from a Jacobian at one state. The registered SQ-2 fixture
    # holds the separation executable: structurally perfect, numerically singular, and no rank
    # word anywhere in the report.
    #
    # Status `implemented`, not `tested`: T06 owns the broader rank diagnostics and the
    # generalization of the certificate class beyond pressure and temperature copies.
    tests:
      - tests/test_k04_regularity.py
      - tests/test_k03_rank.py
      - tests/test_t01_structural.py
    evidence:
      - evidence/K04/bf3d9eef3698e364ceb9d1aaafb80e6ed16b5e29/manifest.json
      - evidence/T01/00a71f4562b7bd80441df50cf64b53064d832b78/manifest.json
    status: implemented

  - id: D06
    title: Scaling order
    blueprint_ref: "§1 D06"
    packages: [K03, T02]
    minimum_evidence: "Scales precede initialization acceptance; fixed within attempt"
    # "Scales precede initialization acceptance" is structural rather than asserted after the
    # fact: the scales are fields of `SolvePlan`, the plan is built before the initializer runs,
    # and `plan_built` is therefore the first event of every trace. "Fixed within attempt" is
    # carried by `AttemptContext`, which holds the scales the attempt's calls use and is frozen;
    # there is one scale segment and it is zero (A34).
    #
    # Status `implemented`, not `tested`: T02 owns rescaling across a design specification's
    # promoted region, which is where "fixed within attempt" first has to be *defended* rather
    # than merely arranged.
    tests:
      - tests/test_k03_scaling.py
      - "tests/test_k03_schemas.py::test_the_solve_keeps_the_context_each_attempt_ran_under"
      - "tests/test_k03_attempts.py::test_every_event_of_an_attempt_carries_that_attempts_signature"
    evidence:
      - evidence/K03/c806f83fd3fb0e71967235000fb517fc1c26efd4/manifest.json
    status: implemented

