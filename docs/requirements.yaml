    blueprint_ref: "§1 D03"
    packages: [P02, K03]
    minimum_evidence: "Explicit SuperLU configuration and linear residual evidence"
    # P02 established that SuperLU is reachable and what its options do; ADR 0004 then fixed the
    # configuration and K03 is the first code to run it on a real problem. Both halves of the
    # minimum evidence are measured on the 44x44 inner block at all five registered variants:
    # the options are asserted verbatim against ADR 0004 D1, and the normalized residual and the
    # |U_ii| screen are recorded on every solve (worst 1.1e-16 and 7.13e-3 respectively).
    #
    # A note on how the screen was nearly worthless: `np.min(diagonal, initial=0.0)` returns 0.0
