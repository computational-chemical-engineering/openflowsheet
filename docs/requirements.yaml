  - id: A08
    title: Local numerical regularity
    blueprint_ref: "§8.1 [A08]"
    packages: [K04, T06]
    minimum_evidence: "Final unregularized Jacobian; bounded condition/rank checks"
    # The 47x47 scaled target Jacobian after alias elimination, factorized by the screen itself
    # at the final state — never a reused Newton factorization, and K03 never factorizes that
    # matrix at all, so nothing could belong to it. Bounded: `rcond_1` by onenormest, escalating
    # to a dense SVD under a 2000-dimension cap and retaining `INCONCLUSIVE` above it.
    #
    # Two things [A08] insists on and that are held by construction rather than by attention.
    # The U-diagonal never decides: the registered triangular family has the ratio exactly 1.0
    # at three different statuses. And thresholds account for scales — unscaled, the same
    # matrices give rcond 9e-12 to 5.9e-11 and a fixed threshold would call every correct answer
    # ill conditioned. The evaluation-uncertainty clause is the absolute limit
    # ||J^-1||_1 <= tau_min/(n eps), which a scale-free condition number cannot see.
    #
    # Status `implemented`, not `tested`: T06 owns rank diagnostics beyond this fixture.
    tests:
      - tests/test_k04_regularity.py
      - tests/test_k03_linear.py
    evidence:
      - evidence/K04/bf3d9eef3698e364ceb9d1aaafb80e6ed16b5e29/manifest.json
    status: implemented

  - id: A09
    title: Independence of energy verification
    blueprint_ref: "§8.1 [A09]"
    packages: [K04, T06]
    minimum_evidence: "Shared provider hashes and limited consistency claim"
    # Every energy and phase check carries `provider_id`, `implementation_sha256`,
    # `data_sha256` and `reference_convention` from `describe()`, with the sentence saying the
    # check is process bookkeeping and not a validation of the enthalpy correlations. A test
    # asserts the complement too: a material or specification check shares no provider and must
    # *not* claim a qualification, so the label means something where it appears.
    #
    # The independence that [A09] does buy is real and measured: the energy check recomputes
    # every stream's enthalpy from a fresh flash of its own (n, T, P) instead of reading the
    # lifted split, and that is what catches the trivial root where all 49 assembled rows pass.
    #
    # Status `implemented`, not `tested`: genuine thermodynamic independence is a property
    # conformance suite and an independent reference comparison, which is M01's, not K04's.
    tests:
      - "tests/test_k04_checks.py::test_a09_every_provider_dependent_check_names_the_provider"
      - "tests/test_k04_checks.py::test_a18_the_trivial_root_is_rejected_and_for_the_right_reasons"
    evidence:
      - evidence/K04/bf3d9eef3698e364ceb9d1aaafb80e6ed16b5e29/manifest.json
    status: implemented

