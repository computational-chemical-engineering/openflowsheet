  - id: D09
    title: Phase appearance
    blueprint_ref: "§1 D09"
    packages: [K03, T03]
    minimum_evidence: "Frozen attempts, bounded restarts, phase-domain outcomes"
    # All three are exercised by OFF-B, the registered phase-change start, which opens all-liquid
    # and must cross into two-phase: attempts are frozen (the signature is fixed at open and every
    # event carries it), bounded (each signature at most once, then ACTIVE_SET_CYCLING; and a cap
    # that reports the attempts actually run rather than the policy's maximum), and the outcomes
    # are phase-domain types -- PHASE_UPDATE_REQUIRED, not a converged answer in the wrong regime.
    #
    # Status `implemented`, not `tested`: T03 owns the general phase-attempt contract (plan §4.1
    # pre-allocates it as ADR 0005). K03's §9 is the interim normative text and is written for the
    # SYN-001 instance -- one signature unit, one registered restart -- so the requirement's
    # general form has no evidence yet.
    tests:
      - tests/test_k03_attempts.py
      - "tests/test_k03_newton.py::test_a_trial_in_another_phase_regime_is_rejected_not_accepted"
      - "tests/test_k03_schemas.py::test_the_restart_context_opens_from_the_regime_it_is_leaving"
    evidence:
      - evidence/K03/c806f83fd3fb0e71967235000fb517fc1c26efd4/manifest.json
    status: implemented

  - id: D10
    title: Property cache
    blueprint_ref: "§1 D10"
    packages: [K02, M02]
    minimum_evidence: "Nearby distinct states do not alias; separate warm-start hints"
    # K02 supplies both halves of the minimum evidence. "Nearby distinct states do not alias" is
    # tested as a *miss*: a one-ulp nudge of any coordinate must reach the provider, witnessed by
    # a call-counting spy rather than by the cache's own bookkeeping, because a cache may not be
    # the only witness to its own behaviour. The complementary direction is tested too -- `-0.0`
    # and `+0.0` must *hit* -- since a cache that never hit at all would satisfy the first rule.
    # "Separate warm-start hints" is carried by the type system: `WarmStartCache` returns a
    # `FlashGuess`, which has no status and no outlet streams, so an approximate lookup cannot be
    # returned as an answer even by mistake.
    #
    # Status `implemented`, not `tested`: the requirement's packages are [K02, M02], and M02's
    # half -- the cache under a real provider and a real solve -- does not exist. Every §6.4 rule
    # is under the gate today and 12 of 12 mutations of them are caught.
    tests:
      - tests/test_k02_cache.py
    evidence:
      - evidence/K02/1baaf033be114e4e44bf982ecee8716b0f040519/manifest.json
    status: implemented

