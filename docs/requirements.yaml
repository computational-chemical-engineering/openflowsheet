    blueprint_ref: "§1 D08"
    packages: [P01, K02, M01]
    minimum_evidence: "Consistent synthetic model and real provider conformance"
    # P01 delivered the synthetic half as an algebraic oracle: h = g - T dg/dT, K from equality
