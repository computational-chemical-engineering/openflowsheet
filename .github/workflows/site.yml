name: Site

# DOC (S14): build the user documentation site (mkdocs.yml, docs-site/) and publish it to this
# repository's GitHub Pages. Every push and pull request builds it strictly — a broken link, a
# missing page or an example notebook that raises fails the run — and only a push to `main` deploys.
# Requires Pages enabled with "Source: GitHub Actions" (Settings -> Pages).
#
# The example notebooks (examples/*.ipynb) are executed during the build, so the environment is the
# project's own: requirements.lock, the coolprop extra's lock (the refrigeration example), the
# project, then the docs tooling's hash-pinned increment (requirements-docs.txt). Every action is
# pinned by commit id, as in ci.yml.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the project, its coolprop extra and the docs tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --require-hashes -r requirements-coolprop.lock
          python -m pip install --no-deps -e .
          python -m pip install --no-deps --require-hashes -r requirements-docs.txt
          python -m pip check

      - name: The generated pages are current
        run: python scripts/doc_pages.py --check

      - name: Build site (strict — fail on broken links, nav or a failing notebook)
        run: mkdocs build --strict --site-dir site

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'computational-chemical-engineering/openflowsheet'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
