name: release

# The release of OpenFlowsheet (docs/RELEASING.md; R-150): dispatched by hand in
# computational-chemical-engineering/openflowsheet, from the branch to release (normally `main`);
# in any other repository every job is skipped. A dry run (the default) runs `gate` and `build`
# and pushes, uploads and publishes nothing.
#
#   gate            the version is `pyproject.toml`'s and of the form X.Y.Z; a tag vX.Y.Z, if it
#                   exists, is on this commit; CHANGELOG.md has its section; the release gate of
#                   the version's minor line (scripts/v<major>_<minor>_gate.py --rc <rc>) exits 0
#                   and prints `vX.Y.Z tag may be proposed: YES`.
#   tag             (not on a dry run) tags the gated commit vX.Y.Z and pushes the tag.
#   build           the sdist and the wheel, built twice and inspected (scripts/t08_dist.py,
#                   T08.A43), from the gated commit.
#   pypi            (not on a dry run) waits for approval in the GitHub environment `pypi`, then
#                   uploads by trusted publishing. PyPI's publisher for `openflowsheet` names this
#                   file, `release.yml`.
#   github-release  (not on a dry run) the GitHub release, with the CHANGELOG section as its notes
#                   and the artifacts attached.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y.Z (pyproject.toml must declare it)"
        required: true
        type: string
      rc:
        description: "The release candidate C the gate judges (full commit id)"
        required: false
        type: string
        default: 67c66d98587f23bd7dfe8da28a8facccc92da21e
      dry_run:
        description: "Dry run: gate and build only; tag, upload and publish nothing"
        required: false
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  RC: ${{ inputs.rc }}

jobs:
  gate:
    if: github.repository == 'computational-chemical-engineering/openflowsheet'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.gate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: The version is pyproject.toml's, and its tag is free or on this commit
        run: |
          refuse() { echo "refused: $*" >&2; exit 1; }
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || refuse "version '$VERSION' is not of the form X.Y.Z"
          declared=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [ "$VERSION" = "$declared" ] \
            || refuse "pyproject.toml declares version '$declared', not '$VERSION'"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            [ "$(git rev-parse "v$VERSION^{commit}")" = "$(git rev-parse HEAD)" ] \
              || refuse "tag v$VERSION exists on another commit"
          fi
      - name: The release notes (the CHANGELOG section)
        run: |
          mkdir -p "$RUNNER_TEMP/record"
          python scripts/changelog_section.py "v$VERSION" > "$RUNNER_TEMP/record/notes.md"
      - name: The release gate
        id: gate
        run: |
          refuse() { echo "refused: $*" >&2; exit 1; }
          IFS=. read -r major minor _ <<< "$VERSION"
          gate="scripts/v${major}_${minor}_gate.py"
          [ -f "$gate" ] || refuse "no release gate $gate for the $major.$minor line"
          status=0
          python "$gate" --rc "$RC" > "$RUNNER_TEMP/record/gate.txt" || status=$?
          cat "$RUNNER_TEMP/record/gate.txt"
          [ "$status" -eq 0 ] || refuse "$gate exited $status"
          grep -qxF "v$VERSION tag may be proposed: YES" "$RUNNER_TEMP/record/gate.txt" \
            || refuse "$gate did not print 'v$VERSION tag may be proposed: YES'"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-record
          path: ${{ runner.temp }}/record/
          if-no-files-found: error

  tag:
    needs: gate
    if: github.repository == 'computational-chemical-engineering/openflowsheet' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      COMMIT: ${{ needs.gate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          fetch-depth: 0
      - name: Tag the gated commit and push the tag
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            tagged=$(git rev-parse "v$VERSION^{commit}")
            if [ "$tagged" != "$COMMIT" ]; then
              echo "refused: tag v$VERSION exists on $tagged, not on $COMMIT" >&2
              exit 1
            fi
            echo "tag v$VERSION exists on $COMMIT"
          else
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "v$VERSION" -m "OpenFlowsheet v$VERSION" "$COMMIT"
            git push origin "refs/tags/v$VERSION"
          fi

  build:
    needs: [gate, tag]
    # Also on a dry run, where `tag` is skipped; never after a failed or cancelled `tag`.
    if: >-
      !cancelled() && github.repository == 'computational-chemical-engineering/openflowsheet'
      && needs.gate.result == 'success'
      && (needs.tag.result == 'success' || (inputs.dry_run && needs.tag.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build the sdist and the wheel (twice, inspected)
        run: python scripts/t08_dist.py --out "$RUNNER_TEMP/dist" --commit HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: ${{ runner.temp }}/dist/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-record
          path: ${{ runner.temp }}/dist/t08-a43-dist.json
          if-no-files-found: error

  pypi:
    needs: build
    if: github.repository == 'computational-chemical-engineering/openflowsheet' && !inputs.dry_run
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openflowsheet/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: [build, pypi]
    if: github.repository == 'computational-chemical-engineering/openflowsheet' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-record
          path: record/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "OpenFlowsheet v$VERSION" --notes-file record/notes.md dist/*
