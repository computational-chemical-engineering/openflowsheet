- id: C02
  mistake: C01 with the turbine outlet S4 declared vapour (FB-05 case 2).
  surfaces: [python, cli, http, mcp]
  code: isentropic_state_two_phase
  kind: not_supported
  chain: [INITIALIZATION_FAILED, initializer_failed, isentropic_state_two_phase]
  in_summary: []
  elements: [T]
  numbers: null
  action_token: vapor_liquid
  gap: {limitation: L-TH-4, capability: true}
  pending:
  - what: numbers
    expect: {names: [s_star, s_saturated, pressure], pressure: 10000.0, above: [s_saturated, s_star]}
    reason: wo5
  - what: elements
    expect: [S4]
    reason: wo5
  text:
    python: |-
      The solve of revision 'rev-000001' stopped before its first iteration: unit 'T' (thermal.turbine) could not compute its outlets from the starting values.
        Cause:   Unit 'T' needs a case this version does not support: its outlet is declared vapour, but its ideal (isentropic) outlet state would be wet.
        Why:     This version computes a turbine's ideal outlet in the phase declared for the real outlet. This is a limitation of the software (L-TH-4), not an error in your flowsheet.
        Do:      Re-declare the outlet as wet ("vapor_liquid") if it can be wet at your conditions. If that is refused as a phase mismatch, change the operating conditions (for example the turbine inlet temperature or outlet pressure) until the ideal and the real outlet are in the same phase. Support for this case is planned (the std.turbine model).
        Kind:    Not supported in this version: a limitation of OpenFlowsheet, not an error in your flowsheet.
        Code:    isentropic_state_two_phase, in INITIALIZATION_FAILED → initializer_failed (openflowsheet explain isentropic_state_two_phase)
        Docs:    https://computational-chemical-engineering.github.io/openflowsheet/messages/refusals/#isentropic_state_two_phase
        Details: initializer_failed(T): isentropic_state_two_phase(T) — job-000001:bundle/failure-bundle.json
    cli: |
      The solve of revision 'rev-000001' stopped before its first iteration: unit 'T' (thermal.turbine) could not compute its outlets from the starting values.
        Cause:   Unit 'T' needs a case this version does not support: its outlet is declared vapour, but its ideal (isentropic) outlet state would be wet.
        Why:     This version computes a turbine's ideal outlet in the phase declared for the real outlet. This is a limitation of the software (L-TH-4), not an error in your flowsheet.
