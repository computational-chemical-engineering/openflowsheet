        Kind:    Not supported in this version: a limitation of OpenFlowsheet, not an error in your flowsheet.
        Code:    isentropic_state_two_phase, in INITIALIZATION_FAILED → initializer_failed (openflowsheet explain isentropic_state_two_phase)
        Docs:    https://computational-chemical-engineering.github.io/openflowsheet/messages/refusals/#isentropic_state_two_phase
        Details: initializer_failed(T): isentropic_state_two_phase(T) — job-000001:bundle/failure-bundle.json
- id: C03
  mistake: Reading solution-state.json from C01's bundle, a run that did not converge.
  surfaces: [python, cli, http, mcp]
  code: not_found
  kind: input
  chain: [not_found]
  in_summary: []
  elements: ['job-000001:bundle', job-000001]
  numbers: []
  action_token: outcome
  gap: null
  pending: []
  text:
    python: |-
      Bundle 'job-000001:bundle' has no file 'solution-state.json': its run ended INITIALIZATION_FAILED and wrote no solution.
        Why:     A run that does not converge writes a failure bundle instead of a solution state and a certificate. This bundle holds check-policy.json, execution-plan.json, failure-bundle.json, revision.json, run-manifest.json, solve-events.json, solve-path.json, solve-plan.json, solve-policy.json, structural-report.json.
        Do:      Check the run's outcome before reading its results; the run result's failure says why it failed, and 'job-000001:bundle/failure-bundle.json' holds the evidence.
        Kind:    Input problem: something in the flowsheet or the request needs to change.
        Code:    not_found (openflowsheet explain not_found)
        Docs:    https://computational-chemical-engineering.github.io/openflowsheet/messages/api-errors/#not_found
        Details: not_found: no such artifact
    cli: |
