- id: C11
  mistake: The turbine outlet pressure at 5 MPa, above its 3 MPa inlet.
  surfaces: [python, cli, http, mcp]
  code: pressure_rise
  kind: input
  chain: [INITIALIZATION_FAILED, initializer_failed, pressure_rise]
  in_summary: []
  elements: [T]
  numbers: null
  action_token: inlet pressure
  gap: null
  pending:
  - what: numbers
    expect: {names: [p_spec, p_inlet], p_spec: 5000000.0, p_inlet: 3000000.0}
    reason: wo5
  text:
    python: |-
      The solve of revision 'rev-000001' stopped before its first iteration: unit 'T' (thermal.turbine) could not compute its outlets from the starting values.
        Cause:   The outlet pressure specified for unit 'T', a turbine, is above its inlet pressure.
        Why:     A turbine expands the fluid that passes through it, so it can only lower the pressure. Raising the pressure takes a pump or a compressor.
        Do:      Give the turbine 'T' an outlet pressure at or below its inlet pressure, or raise the pressure upstream of it (for example a pump's outlet pressure).
