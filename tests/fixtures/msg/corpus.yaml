# MSG-G6 (design note docs/design/MSG-messages.md §3.6, §7): the beginner-mistake corpus.
# Each case is built by the setup function of the same id in tests/test_msg_corpus.py, from the
# README's Rankine change set (examples/rankine-cycle.changeset.json), in a fresh project.
# `text` is an exact golden: regenerate it only with `pytest tests/test_msg_corpus.py --msg-update`
# and review the diff. `pending` items are strict xfails: each must fail today and turn the test red
# the day it holds (docs/MSG_DECISIONS.md D9-1, D9-2). `values` are the numbers' independent expectations
# (review Q1): the case's inputs and the provider's range, compared to relative 1e-12; `above: [a, b]`
# asserts a > b. `<tmp>` stands for the test's directory.
corpus: openflowsheet-msg-corpus-v1
cases:
- id: C01
  mistake: The boiler outlet temperature is set to 973.15 K (FB-03's reproduction).
  surfaces: [python, cli, http, mcp]
  code: phase_regime_mismatch
  kind: input
  chain: [INITIALIZATION_FAILED, initializer_failed, phase_regime_mismatch]
  in_summary: []
  elements: [S4, T]
  numbers: null
  action_token: phase_capability
  gap: null
  pending:
  - what: numbers
    expect: {names: [value, saturated_vapour, pressure], pressure: 10000.0, above: [value, saturated_vapour]}
    reason: q1c
  text:
    python: |-
      The solve of revision 'rev-000001' stopped before its first iteration: unit 'T' (thermal.turbine) could not compute its outlets from the starting values.
        Cause:   Stream 'S4' is not in its declared phase: it is declared wet (vapour + liquid), but at these conditions it is vapour.
        Why:     Each stream carries a declared phase, and a unit computes its outlet only in that phase.
        Do:      Declare 'S4' as vapour: set connections[3].phase_capability to "vapor". If you expected wet (vapour + liquid), check the specifications that set the conditions upstream of 'S4'.
        Kind:    Input problem: something in the flowsheet or the request needs to change.
        Code:    phase_regime_mismatch, in INITIALIZATION_FAILED → initializer_failed (openflowsheet explain phase_regime_mismatch)
        Docs:    https://computational-chemical-engineering.github.io/openflowsheet/messages/refusals/#phase_regime_mismatch
        Details: initializer_failed(T): phase_regime_mismatch(S4) — job-000001:bundle/failure-bundle.json
    cli: |
      The solve of revision 'rev-000001' stopped before its first iteration: unit 'T' (thermal.turbine) could not compute its outlets from the starting values.
        Cause:   Stream 'S4' is not in its declared phase: it is declared wet (vapour + liquid), but at these conditions it is vapour.
        Why:     Each stream carries a declared phase, and a unit computes its outlet only in that phase.
        Do:      Declare 'S4' as vapour: set connections[3].phase_capability to "vapor". If you expected wet (vapour + liquid), check the specifications that set the conditions upstream of 'S4'.
        Kind:    Input problem: something in the flowsheet or the request needs to change.
