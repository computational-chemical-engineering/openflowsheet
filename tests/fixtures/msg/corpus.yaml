- id: C04
  mistake: Creating the project "plant" twice.
  surfaces: [python, cli]
  code: project_exists
  kind: input
  chain: [project_exists]
  in_summary: []
  elements: [<tmp>/plant]
  numbers: []
  action_token: exist
  gap: null
  pending: []
  text:
    python: |-
      Directory '<tmp>/plant' is not empty: it already holds a project, and create() needs a new or empty directory.
        Why:     create() makes a new project and never reuses a directory, so a re-run cannot overwrite work silently.
        Do:      To use the existing project, call LocalApplication.open("<tmp>/plant"), or call LocalApplication.create("<tmp>/plant", exist_ok=True), which opens it.
        Kind:    Input problem: something in the flowsheet or the request needs to change.
        Code:    project_exists (openflowsheet explain project_exists)
        Docs:    https://computational-chemical-engineering.github.io/openflowsheet/messages/refusals/#project_exists
        Details: project_exists: <tmp>/plant
    cli: |
      Directory '<tmp>/plant' is not empty: it already holds a project, and project init needs a new or empty directory.
        Why:     create() makes a new project and never reuses a directory, so a re-run cannot overwrite work silently.
        Do:      The project is ready to use: pass --project <tmp>/plant to other commands, or run project init with --exist-ok.
        Kind:    Input problem: something in the flowsheet or the request needs to change.
        Code:    project_exists (openflowsheet explain project_exists)
        Docs:    https://computational-chemical-engineering.github.io/openflowsheet/messages/refusals/#project_exists
        Details: project_exists: <tmp>/plant
