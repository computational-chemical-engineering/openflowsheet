# Invalid ComponentRecord: no elemental formula and no elemental_verification.
#
# A pseudo-component without an elemental formula must say so explicitly. Omitting
# elemental_verification leaves the verification scope unstated, which blueprint §4.2
# forbids: pseudo-components without elemental formulas explicitly limit the verification
# scope.
expect_error: elemental_verification
