    - 1
    - 0
    - 0
    - -1
    - 0
    - 0
    kind: molar_mass
    meaning: Molecular weight
    role: fixed
    provenance: plan v1.1 §3.1, synthetic
  elemental_composition: null
  parameters: {}
  rights:
    source: Synthetic
    redistribution: synthetic; no restrictions
