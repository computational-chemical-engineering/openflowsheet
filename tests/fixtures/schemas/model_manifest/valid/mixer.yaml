# Declared ModelManifest: SYN-001 adiabatic mixer
#
# `status: declared` and `implementation_artifact.state: not_implemented` mean this document
# states intended behavior for work package K02. No code implements it, no test exercises it,
# and it is not evidence that the model works. Every derivative is declared `unavailable`
# because none exists yet (blueprint §5.2).
id: syn001.adiabatic_mixer
version: 0.0.0-declared
status: declared
title: SYN-001 adiabatic mixer
description: Combines the fresh feed and the liquid recycle at constant pressure.
introduced_by_package: K02
ports:
- name: inlet
  kind: material
  direction: inlet
  multiplicity: many
  component_mapping: revision_component_set
  state_definition: nTP-v1
  phase_capabilities:
  - liquid
- name: outlet
  kind: material
  direction: outlet
  multiplicity: 1
  component_mapping: revision_component_set
  state_definition: nTP-v1
  phase_capabilities:
  - liquid
mathematics:
  equations:
  - id: MIX-mole
    statement: sum_k n_in(k),i - n_out,i = 0 for every component i
    dependencies:
    - inlet.state.n
    - outlet.state.n
    conditional_class: unconditional
    source: docs/derivations/SYN-001.md §4
    dimension:
    - 0
    - 0
    - -1
    - 0
    - 1
    - 0
    - 0
    accumulation:
      kind: zero_holdup_balance
      reason: The adiabatic mixer is a junction with no volume; its outlet is the instantaneous
        sum of its inlets, so the component holdup is identically zero by the model's definition.
        A mixing vessel with holdup is a different model with its own manifest (ADR 0008 D3.5).
  - id: MIX-energy
    statement: 'sum_k Hdot_in(k) - Hdot_out = 0 (adiabatic: Q = 0, W = 0)'
    dependencies:
    - inlet.state
    - outlet.state
    conditional_class: unconditional
    source: docs/derivations/SYN-001.md §4
    dimension:
    - 2
    - 1
    - -3
    - 0
    - 0
    - 0
    - 0
    accumulation:
      kind: zero_holdup_balance
      reason: Junction with no volume and no thermal inertia by the model's definition; the energy
        holdup is identically zero. A mixing vessel is a different model (ADR 0008 D3.5).
  - id: MIX-pressure
    statement: P_in(k) - P_out = 0 for every inlet k
    dependencies:
    - inlet.state.P
    - outlet.state.P
    conditional_class: unconditional
    source: docs/derivations/SYN-001.md §4
    dimension:
    - -1
    - 1
    - -2
    - 0
    - 0
    - 0
    - 0
    accumulation:
      kind: algebraic
  - id: MIX-dormant-inlet
    statement: an inlet with total flow exactly zero contributes exactly zero to both sums and its
      composition is never evaluated
    dependencies:
    - inlet.state.n
    conditional_class: phase_conditional
    source: docs/derivations/SYN-001.md §4
    accumulation:
      kind: algebraic
derivatives:
- output: outlet.state.n
  with_respect_to:
  - inlet.state.n
  method: unavailable
  regime: all
  notes: 'Nothing is implemented in P01, so no derivative exists. Declared `unavailable` rather than
    guessed: a missing derivative is reported as absent, never replaced with zeros (blueprint §5.2).
    K02 implements the model and K01 supplies the derivative route.'
- output: outlet.state.T
  with_respect_to:
  - inlet.state.n
  - inlet.state.T
  method: unavailable
  regime: all
  notes: 'Nothing is implemented in P01, so no derivative exists. Declared `unavailable` rather than
    guessed: a missing derivative is reported as absent, never replaced with zeros (blueprint §5.2).
    K02 implements the model and K01 supplies the derivative route.'
initialization:
  strategy: upstream_propagation
  registered_initializer: null
  notes: The outlet temperature bracket is built from the inlet temperatures.
validity:
  domain:
    temperature_K:
      min: 280.0
      max: 440.0
    pressure_Pa:
      min: 50000.0
      max: 200000.0
    components:
    - A
    - B
    - C
    phases:
    - liquid
    - zero_flow
  limitations:
  - v0.0 restricts the enthalpy closure to the subcooled-liquid domain with a typed failure outside
    it; general PH support is T05 (plan §3.2, §4.2 K02).
  - No registered SYN-001 r-variant leaves that domain, so K02 needs a separate case (for example
    a fresh feed above its bubble point) to exercise the typed failure (derivation §7 finding 5).
  - All inlet pressures must equal the outlet pressure. A mismatch is a validation failure; the unit
    never silently repairs an invalid pressure network.
implementation_artifact:
  state: not_implemented
  module: null
  artifact_hash: null
  planned_package: K02
execution_requirements:
  execution_class: native_equation
  thread_safety: unknown
  evaluation_cost_class: unknown
  property_provider: syn001
  reference_convention: SYN-001-ref-v1
