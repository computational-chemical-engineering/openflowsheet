# Declared ModelManifest: SYN-001 stream splitter
#
# `status: declared` and `implementation_artifact.state: not_implemented` mean this document
# states intended behavior for work package K02. No code implements it, no test exercises it,
# and it is not evidence that the model works. Every derivative is declared `unavailable`
# because none exists yet (blueprint §5.2).
id: syn001.stream_splitter
version: 0.0.0-declared
status: declared
title: SYN-001 stream splitter
description: Splits one stream into a recycle and a purge at fixed fraction r.
introduced_by_package: K02
ports:
- name: inlet
  kind: material
  direction: inlet
  multiplicity: 1
  component_mapping: revision_component_set
  state_definition: nTP-v1
  phase_capabilities:
  - liquid
- name: recycle
  kind: material
  direction: outlet
  multiplicity: 1
  component_mapping: revision_component_set
  state_definition: nTP-v1
  phase_capabilities:
  - liquid
- name: purge
  kind: material
  direction: outlet
  multiplicity: 1
  component_mapping: revision_component_set
  state_definition: nTP-v1
  phase_capabilities:
  - liquid
mathematics:
  equations:
  - id: SPLIT-recycle
    statement: n_rec,i - r n_in,i = 0 for every component i
    dependencies:
    - inlet.state.n
    - parameters.split_fraction
    conditional_class: unconditional
    source: docs/derivations/SYN-001.md §4
    dimension:
    - 0
    - 0
    - -1
    - 0
    - 1
    - 0
    - 0
    accumulation:
      kind: algebraic
  - id: SPLIT-purge
    statement: n_pur,i - (1 - r) n_in,i = 0 for every component i
    dependencies:
    - inlet.state.n
    - parameters.split_fraction
    conditional_class: unconditional
    source: docs/derivations/SYN-001.md §4
    dimension:
    - 0
    - 0
    - -1
    - 0
    - 1
    - 0
    - 0
    accumulation:
      kind: algebraic
  - id: SPLIT-T
    statement: T_rec - T_in = 0 and T_pur - T_in = 0
    dependencies:
    - inlet.state.T
    conditional_class: unconditional
    source: docs/derivations/SYN-001.md §4
    dimension:
    - 0
    - 0
    - 0
    - 1
    - 0
    - 0
    - 0
    accumulation:
      kind: algebraic
  - id: SPLIT-P
    statement: P_rec - P_in = 0 and P_pur - P_in = 0
    dependencies:
    - inlet.state.P
    conditional_class: unconditional
    source: docs/derivations/SYN-001.md §4
    dimension:
    - -1
    - 1
    - -2
    - 0
    - 0
    - 0
    - 0
    accumulation:
      kind: algebraic
derivatives:
- output: recycle.state.n
  with_respect_to:
  - inlet.state.n
  - parameters.split_fraction
  method: unavailable
  regime: all
  notes: 'Nothing is implemented in P01, so no derivative exists. Declared `unavailable` rather than
    guessed: a missing derivative is reported as absent, never replaced with zeros (blueprint §5.2).
    K02 implements the model and K01 supplies the derivative route.'
- output: purge.state.n
  with_respect_to:
  - inlet.state.n
  - parameters.split_fraction
  method: unavailable
  regime: all
  notes: 'Nothing is implemented in P01, so no derivative exists. Declared `unavailable` rather than
    guessed: a missing derivative is reported as absent, never replaced with zeros (blueprint §5.2).
    K02 implements the model and K01 supplies the derivative route.'
initialization:
  strategy: upstream_propagation
  registered_initializer: null
  notes: Both outlets follow linearly from the inlet; no independent guess.
validity:
  domain:
    temperature_K:
      min: 280.0
      max: 440.0
    pressure_Pa:
      min: 50000.0
      max: 200000.0
    components:
    - A
    - B
    - C
    phases:
    - liquid
    - zero_flow
  limitations:
  - Linear in the component flows, so both outlets are exact at r = 0 and at a dormant inlet (ADR
    0001 D3.4).
  - r = 1 leaves the SYN-001 loop without a steady state and is rejected rather than clipped (derivation
    §5).
  - Composition is identical in both outlets by construction; the splitter separates nothing.
implementation_artifact:
  state: not_implemented
  module: null
  artifact_hash: null
  planned_package: K02
execution_requirements:
  execution_class: native_equation
  thread_safety: unknown
  evaluation_cost_class: unknown
  property_provider: syn001
  reference_convention: SYN-001-ref-v1
