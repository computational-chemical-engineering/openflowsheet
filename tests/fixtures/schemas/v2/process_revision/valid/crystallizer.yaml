# E-F2-2: every construct of ADR 0062 D9 to D11 in one v2 revision. Three connection kinds
# (material: `mat-v1` and `nTP-v1`; energy; signal), four endpoint kinds (port, probe, parameter,
# specification), a `mat-v1` definition with `mixed` and `solid` substreams, a group basis (charged
# groups), a classed attribute on a grid, a component dissolved in `mixed` with its crystals in
# `solid` (Q8.A1), a reaction set, a section. Valid against tests/fixtures/schemas/v2/context.yaml.
schema_version: 2
revision_id: crystallizer-r1
parent_revision: null
title: Brine and syrup crystallizers
convention: ELEMENTAL-ref-v1
component_set:
  components:
    - {id: H2O, record: "1111111111111111111111111111111111111111111111111111111111111111"}
    - {id: Na_p, record: "2222222222222222222222222222222222222222222222222222222222222222"}
    - {id: Cl_m, record: "3333333333333333333333333333333333333333333333333333333333333333"}
    - {id: NaCl, record: "4444444444444444444444444444444444444444444444444444444444444444"}
    - {id: sucrose, record: "5555555555555555555555555555555555555555555555555555555555555555"}
  parameter_sets: ["6666666666666666666666666666666666666666666666666666666666666666"]
materials:
  thermal_coordinate: h_mass
  phase_order_keys: [H2O]
  definitions:
    - id: brine
      template: mat-v1
      thermal_coordinate: h_mass
      substreams:
        - id: liq
          kind: mixed
          components: [H2O, Na_p, Cl_m]
          conserved_basis:
            preset: null
            species: [H2O, Na_p, Cl_m]
            groups:
              - {id: Na, content: {Na_p: 1}}
              - {id: H2O, content: {H2O: 1}}
              - {id: Cl, content: {Cl_m: 1}}
            fast_reactions: null
          grids: []
          attributes: []
        - id: cryst
          kind: solid
          components: [NaCl]
          conserved_basis: {preset: "true"}
          grids:
            - {id: L, quantity_kind: dimensionless, edges: [0.0, 0.25, 0.5, 1.0]}
          attributes:
            - {kind: probe.classes, version: 1.0.0, components: [NaCl], grid: L}
    - id: syrup
      template: mat-v1
      thermal_coordinate: h_mass
      substreams:
        - id: liq
          kind: mixed
          components: [H2O, sucrose]
          conserved_basis: {preset: "true"}
          grids: []
          attributes: []
        - id: cryst
          kind: solid
          components: [sucrose]
          conserved_basis: {preset: "true"}
          grids:
            - {id: L, quantity_kind: dimensionless, edges: [0.0, 0.5, 1.0]}
          attributes:
            - {kind: probe.partition, version: 1.0.0, components: [sucrose], grid: L}
            - {kind: probe.moments, version: 1.0.0, components: null, grid: L}
reaction_sets:
  - id: dissolution
    reactions:
      - id: r1
        stoichiometry: {NaCl: [-1, 1], Na_p: [1, 1], Cl_m: [1, 1]}
        scope: [liq, cryst]
property_methods: {default: syn001-ideal, overrides: []}
