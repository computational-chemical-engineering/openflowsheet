[project.scripts]
# Blueprint D15: local Python and CLI share one contract, and neither needs a network round
# trip. The console script is a thin wrapper over `openflowsheet.application.cli`.
openflowsheet = "openflowsheet.application.cli:main"

[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "openflowsheet"
version = "0.4.0.dev0"
description = "OpenFlowsheet: an agent-native open process simulator"
requires-python = ">=3.13"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Frank Peters", email = "e.a.j.f.peters@tue.nl" }]
dependencies = [
    "numpy==2.2.4",
    "scipy==1.15.3",
    "pyyaml==6.0.2",
    "jsonschema==4.26.0",
    # The compiled backend selected by ADR 0003 on the P02/P03 evidence. Pinned exactly, because
    # the [A10] audit in docs/p03-binary-audit.md is of these bytes and no others: changing this
    # pin re-runs scripts/p03_binary_inventory.py before it merges (ADR 0006 D5.4). CasADi is
    # LGPL-3.0-or-later and is used through its Python API only; see the third-party notice in
    # README.md (ADR 0006 D5.1).
    "casadi==3.8.0",
]

# PyPI's sidebar (V03-post1): every link absolute, as README.md's (tests/test_readme_current.py).
[project.urls]
Homepage = "https://computational-chemical-engineering.github.io/openflowsheet/"
Documentation = "https://computational-chemical-engineering.github.io/openflowsheet/"
Repository = "https://github.com/computational-chemical-engineering/openflowsheet"
Issues = "https://github.com/computational-chemical-engineering/openflowsheet/issues"
Changelog = "https://github.com/computational-chemical-engineering/openflowsheet/blob/main/CHANGELOG.md"
"Release notes" = "https://github.com/computational-chemical-engineering/openflowsheet/releases"

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "mypy==1.15.0",
    "ruff==0.12.11",
    "types-PyYAML==6.0.12.20260906",
    "types-jsonschema==4.26.0.20260518",
    "mpmath==1.3.0",  # derivation scripts under docs/derivations/scripts (P01 reference values)
]
# T07 §11.1: the HTTP and MCP bindings' libraries, optional so that the default install is
# unchanged. `mcp` is the latest 1.x that speaks protocol 2025-06-18 (`structuredContent`,
# `outputSchema`); starlette and uvicorn are the versions `mcp` resolves to, pinned exactly. The
# closure's transitive pins are in requirements.lock, and its licences are inventoried by
# scripts/t07_licence_inventory.py (gate G19).
server = [
    "mcp==1.30.0",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
]
# S07 ADR 0046: the optional CoolProp pure-fluid Helmholtz provider (`coolprop-heos-v1`). Not a
# base dependency: the default install is unchanged, and the provider imports CoolProp lazily.
coolprop = ["CoolProp==8.0.0"]
# M03 ADR 0032 D5: the optional general-NLP bridge. Installable only into the audited environment
# of docs/m03-ipopt-audit.md (scripts/build-m03-ipopt-env.sh), which provides cyipopt 1.7.0 from
# conda-forge and libpynumero_ASL; PyPI has no cyipopt wheel for CPython 3.13.
nlp = [
    "pyomo==6.10.1",
    "cyipopt==1.7.0",
    "packaging==26.3",  # Pyomo detects numpy through packaging.version and does not declare it
]
# E01 ADR 0052 D7 (design §4.8.4): the optional offline Brightway adapter that builds frozen LCA
# unit-score tables. Never imported by a solve, an optimization or a replay; without it every
# adapter call is `UNSUPPORTED(LCA_ENGINE_UNAVAILABLE)`. Not bw2io, not pypardiso (§7 Q11). The
# audited environment is scripts/build-lca-env.sh (benchmarks/e01/brightway/lca-pip.lock); the
# closure's licences are docs/e01-lca-licences.json (scripts/e01_d04_inventory.py).
lca = [
    "bw2data==4.7",
    "bw2calc==2.5.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# T08 W4.2: the runtime data the installed package reads (`openflowsheet.resources`). `_data/`
# holds symbolic links to the single repository copies, so the wheel carries their bytes and the
# checkout reads the originals; T08.A43's build check compares the two file by file.
openflowsheet = [
    "py.typed",
    "_data/schemas/*.schema.json",
    "_data/benchmarks/k04/reference_values.yaml",
    "_data/benchmarks/syn001/reference_values.yaml",
    "_data/benchmarks/t08/numerical_policy_v2.yaml",
    "_data/benchmarks/m01/components.yaml",
    # M02 (register R-317 (b)): the external addendum, whose `compare` rules a coupled replay reads.
    "_data/benchmarks/m02/numerical_policy_external.yaml",
    # S05 (R-616): the IAPWS-95 coefficients `iapws95-v1` reads, with IAPWS's attribution in NOTICE.
    "_data/benchmarks/s05/iapws95_coefficients.json",
    # E01 (ADR 0052): the assessment data (cost set, chain presets, index series, LCA tables), with
    # the third-party attributions in NOTICE; one glob per directory.
    "_data/assessment/cost/*.json",
    "_data/assessment/index/*.json",
    "_data/assessment/lca/*.json",
    # V03 (R-880): Wilson's records and the Kurihara 1993 Table II points, with their attribution
    # in NOTICE.
    "_data/benchmarks/s10/records.yaml",
    "_data/benchmarks/s10/vle/kurihara1993_binaries.csv",
    # M06 (ADR 0030 D2): the diagnostic web shell, `_data/web` → `apps/web/`, one glob per
    # directory (`serve-http --ui`).
    "_data/web/*.html",
    "_data/web/*.svg",
    "_data/web/css/*.css",
    "_data/web/js/*.js",
    "_data/web/js/model/*.js",
    "_data/web/js/screens/*.js",
]
# The MCP tool descriptions and their review record are served text (T07 W6c, gate G15).
"openflowsheet.application.bindings" = ["descriptions/*.md", "descriptions/REVIEW.json"]
# M02 design note §3.1, §2.4: the registered variants and their registry (append-only package
# data), and the reactor environment's hash-pinned lock.
"openflowsheet.adapters" = ["variants/*.json", "pymrm/reactor-env.lock"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
# The SYN-001 oracle and its tests use the physical symbols of the derivation (T, P, K, V, L,
# F, Q_*, H_*) as identifiers. Those names are fixed by docs/derivations/SYN-001-oracle-spec.md
# §1, frozen per docs/interfaces-frozen.md, so pep8-naming's lowercase rules for arguments
# (N803), local variables (N806) and dataclass fields such as `sum_zK` (N815) are switched off
# for these three files only. Apart from the S03 tool scripts' waivers below (E501, F841 and the
# formatter), no other check is relaxed anywhere.
"benchmarks/syn001/oracle.py" = ["N803", "N806", "N815"]
"tests/test_syn001_oracle.py" = ["N803", "N806"]
"tests/test_syn001_reference_values.py" = ["N803", "N806"]
# The S03 tool scripts are the provenance of the committed tool records. They stay byte-identical to
# their qualification commits (2eb71ac0, 5474531f), which A03 scans, so long lines are waived, not
# rewrapped (S03 §19.5, R-644). An edit to either script means a new qualification run.
# The same §19.5 waiver covers the one other check s03_qualify_idaes.py fails at its qualification
# commit, F841 (an unused local, `pyo` in `inspection`; S03 WO-S03-6 build decision B6-1).
"spikes/references/s03_qualify_idaes.py" = ["E501", "F841"]
"spikes/references/s03_qualify_dwsim.py" = ["E501"]

[tool.ruff.format]
# The S03 tool scripts are not reformatted either: an edit means a new qualification run (S03 §19.5,
# R-644; S03 WO-S03-6 build decision B6-1).
exclude = ["spikes/references/s03_qualify_idaes.py", "spikes/references/s03_qualify_dwsim.py"]

[tool.mypy]
python_version = "3.13"
# `benchmarks` is type-checked as strictly as `src`: the SYN-001 oracle is an acceptance
# reference for K02-K04 and must not drift (P01).
files = ["src", "benchmarks"]
# Shadows the malformed stub CasADi 3.8.0 ships; see stubs/casadi/__init__.pyi for why.
mypy_path = ["stubs"]
strict = true
warn_unreachable = true

# SciPy ships no py.typed marker and no stub package is pinned, so its imports are untyped.
# This narrows *only* the missing-stub error for scipy; every other strict check still applies to
# the code that uses it, and no repository module is exempted.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# M03 WO-8: Pyomo and cyipopt exist only in the audited NLP environment (docs/m03-ipopt-audit.md),
# never in the default install the gate type-checks, and ship no stubs. This narrows only the
# missing-import error for those two packages, which only `openflowsheet.studies.nlp.greybox`
# imports; every other strict check still applies to that module.
[[tool.mypy.overrides]]
module = ["pyomo.*", "cyipopt.*"]
ignore_missing_imports = true

# E01 WO-B1: bw2data and bw2calc exist only in the audited `lca` environment
# (scripts/build-lca-env.sh), are imported inside the adapter's calls, and ship no stubs;
# bw_processing (bw2calc's pinned dependency) builds the adapter's float64 datapackages.
[[tool.mypy.overrides]]
module = ["bw2data.*", "bw2calc.*", "bw_processing.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root on sys.path so `benchmarks.syn001.oracle` imports without installing it;
# the oracle is deliberately not part of the `openflowsheet` distribution.
pythonpath = ["."]
# Tests needing an opt-in environment are deselected (not skipped) here; a `-m` on the command
# line overrides this. M03 WO-8 (ADR 0032 C2): `nlp` needs the audited NLP environment, and
# scripts/m03_nlp_check.sh runs them there with `-m nlp`. M02 WO-5 (design note §10.2): `pymrm`
# needs the pinned reactor environment (`python -m openflowsheet.adapters.pymrm.env build`), and
# `pytest -m pymrm` runs them there.
addopts = "-m 'not nlp and not pymrm'"
markers = [
    "nlp: needs the audited Ipopt environment of docs/m03-ipopt-audit.md (scripts/m03_nlp_check.sh)",
    "pymrm: needs the pinned reactor environment of M02 design note §2.4 (opt-in evidence)",
    "browser: drives a headless Chromium (M06 design note §8 A6); skipped without one, failed without one when OPENFLOWSHEET_REQUIRE_BROWSER=1",
]
