- code: L-COL-7
  family: limitation
  kind: notice
  complete: false
  title: L-COL-7
  summary: On `wilson-ig-v2` the column's Stage B (S08's block re-entry) is tested at the opening level
    only (S10-C).
- code: L-COL-8
  family: limitation
  kind: notice
  complete: false
  title: L-COL-8
  summary: 'SYN-001 columns are synthetic (L18): their results are verified, never validated.'
- code: L-COL-9
  family: limitation
  kind: notice
  complete: false
  title: L-COL-9
  summary: In a flowsheet a column region has edge-3 continuation only under `RRC-revision-v1`, from a
    verified ancestor that differs only in operating values. A first solve, a structural edit (stage count,
