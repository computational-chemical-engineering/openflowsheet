    commit time.
- code: L44
  family: limitation
  kind: notice
  complete: false
  title: L44
  summary: 'The C1 reactor (`c1.reactor`) is measured on Linux x86-64 only, on one machine (`ref-x86-64`).
    Its runs are opt-in: they need the separately built, pinned reactor environment, which no CI job builds
    (M02 N2). They are reproducibility class R3 (ADR 0034 D6). A run on aarch64 is not measured, nor is
    the reproduction of a coupled run across architectures. macOS is best effort, and Windows is refused
    before spawn (ADR 0033 D2).'
- code: L45
  family: limitation
  kind: notice
  complete: false
  title: L45
  summary: '`external-subprocess-v1` runs the group''s pinned code with the user''s privileges and is
    not a sandbox: there is no filesystem confinement, network isolation, memory or CPU quota, or syscall
    filtering, and trust rests on provenance (ADR 0033 D2; M02 N1).'
- code: L46
  family: limitation
  kind: notice
  complete: false
  title: L46
  summary: No reactor result has been compared with experimental data by this project. The group's published
    comparison (Gargiulo et al. 2025 §3.1, of Rossetti et al. 2006's rate law) is the group's evidence.
    Every real-reactor number is the group's model at the pin, a regression, and its discretization bias
    is 1.0–1.4 % in NH₃ (M02 design note §13).
- code: L47
  family: limitation
  kind: notice
  complete: false
  title: L47
  summary: '`pr-c1-v1`''s saturated-liquid NH₃ volume is 11–30 % high (240–400 K) and its enthalpy of
    vaporization 2–5 % high (−7 % at 400 K), against the reference equations of state. No v0.2 loop decision
    uses either.'
- code: L48
  family: limitation
  kind: notice
  complete: false
  title: L48
  summary: The C1 loop's convergence is evidenced at the corners and the centre of its registered hard
    domain only (M02 G11). The inert-fraction floor y_inert ≥ 0.035 sits just above a measured stage-1
    failure (0.03 at 653.15 K, 11 MPa, H₂/N₂ 2.5). A failure inside the domain ends in a typed refusal
    and then `COUPLING_NOT_CONVERGED`, never in a false success.
- code: L49
  family: limitation
  kind: notice
  complete: false
  title: L49
  summary: 'No promotable surrogate of the real C1 reactor exists in v0.2. M04''s one real iteration (plan
    `b2-it1` on box v2, reactor variant v3) is NOT_PROMOTABLE (`band_not_finite`): 26 of its 632 registered
    experiments, 5 of them among the 118 calibration draws, end in a deterministic `reactor_not_accepted(certificate)`,
    more than the n − k = 4 refused draws the conformal band tolerates, so q̂ is infinite. A revision
    binds `c1.reactor_surrogate` only through a manifest that re-derives PROMOTABLE (R-360), and no further
    iteration on v3 is admissible (R-364).'
- code: L-S11-1
  family: limitation
  kind: notice
  complete: false
  title: L-S11-1
  summary: '`iapws95-v1` (IAPWS-95, S05) is selected by `record_source: benchmarks/s05/components.yaml`
    for the one component H2O, over 273.16–1273.15 K and 10²–10⁸ Pa. The routing models (`syn001.feed_source`,
    `syn001.product_sink`, `syn001.stream_splitter`) and the seven `thermal.*` models (L-TH-1..8) bind
    on it; its evidence is S05''s validation against the IAPWS-95 reference equation (S05 spec).'
- code: L-S11-2
  family: limitation
  kind: notice
  complete: false
  title: L-S11-2
  summary: '`coolprop-heos-v1` (CoolProp HEOS, S07) is selected by `record_source: benchmarks/s07/components.yaml`
    for exactly one admitted fluid per revision, among the 123 of S07''s table; each fluid keeps S07''s
    tier and domain. The routing models and the seven `thermal.*` models (L-TH-1..8) bind on it, and it
    needs the `coolprop` extra: without CoolProp installed, binding is refused `basis_unavailable(coolprop-heos-v1)`.'
- code: L-S11-3
  family: limitation
  kind: notice
  complete: false
  title: L-S11-3
  summary: '`wilson-ig-v2` (S10''s Wilson activity model with an ideal-gas vapour; `wilson-ig-v1`''s answers
    with the molar entropy added, S11 units design §4.6) is selected by `record_source: benchmarks/s10/records.yaml`
    for its three record components (CH3OH, C2H5OH, H2O, in any order), over 300–400 K and 30–200 kPa.
    The routing models, the column (`syn001.column`, L-COL-1..10), the five K02/T05 units with γ–φ faces
    and the vapour machines `thermal.compressor` and `thermal.turbine` (L-GP-1..3) bind on it. Its records
    ship as package data (R-880), so it binds in a wheel. An installation with neither copy is refused
    `basis_unavailable(wilson-ig-v2)`. The library constructors `WilsonIdealGasProvider()` and `WilsonIdealGasProviderV2()`
    with no argument read a source checkout only and elsewhere refuse `records_missing`. A library user
    passes `resources.packaged_path(wilson_ig.RECORDS_PATH)` (R-883). Premises P1–P3 are checked at binding.
    The S10 VAL-1–3 bands apply, and the VAL-3 latent-heat miss (methanol, +5.72 % against 5 %) is carried.
    Results are compared across architectures by tolerance, not bitwise.'
- code: L-COL-1
  family: limitation
  kind: notice
  complete: false
  title: L-COL-1
  summary: 'The column''s feeds are single-phase and declared: one side feed per stage, none at a slot
    stage (S01 DECISION 8, S02 §1.4), and every side feed on its `feed` port shares one declared phase
    (the revision reader''s one phase per port). A two-phase feed needs a flash and two stages.'
- code: L-COL-2
  family: limitation
  kind: notice
  complete: false
  title: L-COL-2
  summary: 'The column has no side draws, pump-arounds, stage efficiencies or hydraulics, and is solved
    by S02''s Newton method only: no inside-out or rate-based method (S02 §14).'
- code: L-COL-3
  family: limitation
  kind: notice
  complete: false
  title: L-COL-3
  summary: A total condenser gives saturated liquid (no subcooling); there is no total reboiler.
- code: L-COL-4
  family: limitation
  kind: notice
  complete: false
  title: L-COL-4
  summary: 'On `wilson-ig-v2` the column''s end specifications are ratio, rate and duty only: a purity,
    recovery or temperature end is refused at binding (S10-C D8).'
- code: L-COL-5
  family: limitation
  kind: notice
  complete: false
  title: L-COL-5
  summary: 'No uniqueness, multiplicity or feasibility claim for a column beyond S06 §14: a certificate
    holds at the converged state, and an inverse specification''s feasibility is decided only on S06''s
    registered band.'
- code: L-COL-6
  family: limitation
  kind: notice
  complete: false
  title: L-COL-6
  summary: In a flowsheet a purity end's tolerance acts on the mole fraction directly (`|x − x*|` ≤ the
