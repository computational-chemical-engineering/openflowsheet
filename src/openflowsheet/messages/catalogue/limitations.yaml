- code: L43
  family: limitation
  kind: notice
  complete: false
  title: L43
  summary: 'The Anderson recycle, its stagnation restart (recovery edge E1) and the stalled-recycle EO
    merge (E2) are library capabilities: every shipped unit that can sit in a loop declares exact derivatives,
