- code: L-TH-2
  family: limitation
  kind: notice
  complete: false
  title: L-TH-2
  summary: Saturated pure-fluid streams are produced only by `thermal.*` units; there are no wet feeds,
    and routing models do not carry them.
- code: L-TH-3
  family: limitation
  kind: notice
  complete: false
  title: L-TH-3
  summary: '`thermal.flash` needs a two-phase state at drum pressure; its products are declared `vapor_liquid`.'
- code: L-TH-4
  family: limitation
  kind: notice
  complete: true
  title: L-TH-4
  summary: A turbine's ideal (isentropic) outlet is computed in the phase declared for its real outlet,
    so a vapour outlet whose ideal state would be wet is refused.
  why: This version takes the phase of a machine's ideal outlet from the phase declared for its real outlet.
    It does not compute a two-phase ideal state for a turbine whose outlet is declared vapour, and it
    refuses a compressor whose ideal state would be two-phase.
  action: Declare the outlet wet if it can be wet at your conditions, or change the operating conditions
    until the ideal and the real outlet are in the same phase; `openflowsheet explain isentropic_state_two_phase`
    gives the details.
  see_also:
  - isentropic_state_two_phase
  examples:
  - params: {}
- code: L-TH-5
  family: limitation
  kind: notice
  complete: false
  title: L-TH-5
  summary: 'The near-critical box and the supercritical label rule of S05 §4.2 and S07. A supercritical
    PH or PS closure whose root lies at the provider''s label switch (T = T_c) returns `not_converged`
    (measured: 4 of 11 200 grid outcomes, at 22.85 MPa).'
- code: L-TH-6
  family: limitation
  kind: notice
  complete: false
  title: L-TH-6
  summary: No regime discovery for pure fluids.
- code: L-TH-7
  family: limitation
  kind: notice
  complete: false
  title: L-TH-7
  summary: Dormant single-phase thermal outlets need T05b's v2 phase contract to solve. Under v1 a converged
    start certifies RANK_DEFICIENT, and a solve that must move ends LINEAR_SOLVE_FAILED. Under either
    contract, a converged run with such an outlet certifies UNVERIFIED, with regularity RANK_DEFICIENT.
    The verifier's own dormant-outlet table (verify.zero_flow.DORMANT_OUTLETS, spec §7.6) has no thermal.*
    outlet, so it judges the outlet's energy row, which reads no temperature at zero flow.
- code: L-TH-8
  family: limitation
  kind: notice
  complete: false
  title: L-TH-8
  summary: A revision declares one phase per port (R4), so a `thermal.mixer` takes inlets of one declared
    phase. Mixing a liquid with a vapour is available by direct construction only, as L-COL-1 is for the
    column's side feeds.
- code: L-GP-1
  family: limitation
  kind: notice
  complete: false
  title: L-GP-1
  summary: On Wilson (`wilson-ig-v2`), only the five K02/T05 units and the two machines; no pump (no liquid
    volume); exchanger, separator and reactors refused.
- code: L-GP-2
  family: limitation
  kind: notice
  complete: false
  title: L-GP-2
  summary: Wilson machines are single-phase vapour, within the records' domain (300–400 K, 30–200 kPa).
- code: L-GP-3
  family: limitation
  kind: notice
  complete: false
  title: L-GP-3
  summary: A Wilson TP flash near an azeotrope has an E-2 noise floor (S10 §14); a temperature-degenerate
    split is judged on its stored split.
- code: L-E01-1
  family: limitation
  kind: notice
  complete: false
  title: L-E01-1
  summary: Since R-898 every P2 capital row is floored, so P2's optimization exercises operating cost
    only; no registered NLP case carries a capital row in a `units:N` regime. A floor's derivative row
    is empty (E01.A18), so E01.A33–A36 show nothing about capital sensitivities through the optimizer.
    P2 is not resized (E01 design §9.7).
- code: L-OPT-1
  family: limitation
  kind: notice
  complete: false
  title: L-OPT-1
  summary: 'Revision optimisation (ADR 0071) runs only on the `revision_eo` route in the audited `nlp`
    environment on linux-x86_64. Each start holds its phase and assessment regimes: a candidate whose
    regime changed is NOT_VERIFIED; a boundary optimum is verified only on the single-phase side of a
    guarded regime (`phase_boundary_form`, flagged, and a plain solve of the committed candidate certifies
    UNVERIFIED); two-phase-side and unguarded-regime boundary optima and candidates in the rank-limited-but-inactive
    gap are NOT_VERIFIED; the zero-flow subsystem is held or unresolved per start, all or nothing. KKT_POINT_VERIFIED
    is numerically verified local stationarity, not optimality.'
- code: L-OPT-2
  family: limitation
  kind: notice
  complete: false
  title: L-OPT-2
  summary: Ipopt runs with fixed options (monotone barrier, limited-memory Hessian). On a nearly linear
    objective whose constraint must become active from inside the feasible region it can stall at `max_iter`
    (measured on OPT-L from 673.15 K and 661 K; it verifies from 650 K, a start that violates the constraint).
    Such a start is reported SOLVER_FAILED, never verified; another start is the remedy.
- code: L-X04-1
  family: limitation
  kind: notice
  complete: false
  title: L-X04-1
  summary: 'Gauge pressures are not accepted as inputs: ADR 0016''s input rows stand, and a gauge unit
    (`barg`, `psig`) in a revision or a change is refused with its existing code. Gauge units are display
    units only, resolved against the project''s declared ambient pressure. Input conversion at commit
    is the planned remedy, not built in 0.4.'
- code: L-X04-2
  family: limitation
  kind: notice
  complete: false
  title: L-X04-2
  summary: Display units change responses only. Stored and hashed documents, raw artifacts, check quotes
    and the web shell's as-solved state table stay SI; a display preference never reaches a run, a bundle,
    a certificate or a cache key.
- code: L-X04-3
  family: limitation
  kind: notice
  complete: false
  title: L-X04-3
  summary: 'A number without a display kind or a display row stays SI under every preference: the stream
    table''s `S_flow` (W/K), `V_flow` (m³/s), `rho` (kg/m³), `v` (m³/mol) and `molar_mass`, and every
    message number without a quantity kind.'
