    continuation).'
- code: L21
  family: limitation
  kind: notice
  complete: false
  title: L21
  summary: 'Edge 3''s continuation exists for a region with a promoted specification (specification continuation).
    Under `RRC-revision-v1`, it also exists for a revision region whose nearest verified ancestor has
    the same declaration and differs only in registered operating values (revision continuation, ADR 0072).
    Everywhere else edge 3 is the sequential restart or `unsupported(…)`. Neither continuation changes
    the active set. `RRC-revision-v1` is not a superset of `T06-revision-v2`: a continuation that stops
    part-way ends the step and the restart is not tried (one recovery per step), so it can fail where
    `T06-revision-v2` converges, and no registered case is rescued by it that `T06-revision-v2` does not
    rescue.'
- code: L22
  family: limitation
  kind: notice
  complete: false
  title: L22
  summary: 'Scope of the solver evidence: tear selection is greedy (minimality not claimed); behaviour
