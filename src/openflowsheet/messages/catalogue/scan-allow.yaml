# MSG-G2 (design note §3.2): tokens the static scan finds that are not codes, each with its reason.
# `msg_catalogue.py scan` fails on a found token that has neither an entry nor a line here.
allow:
  stage_count: "models/syn001/column_unit.py `_refuse(unit, key, …)`: a key; the code emitted is invalid_spec(<key>)"
  pressure_profile: "models/syn001/column_unit.py `_refuse(unit, key, …)`: a key; the code emitted is invalid_spec(<key>)"
  no_feed: "models/syn001/column_unit.py `_refuse(unit, key, …)`: a key; the code emitted is invalid_spec(<key>)"
  evaluate_phase: "a budget-spend label (`_spend(f\"evaluate_phase(…)\")`), never a message"
  coupling_iterate: "a replay-difference location label (run/coupled replay), not a refusal code"
  request_key: "a replay-difference location label (external requests), not a refusal code"
  external_request: "a replay-difference location label (external requests), not a refusal code"
  external_result: "a replay-difference location label (external results), not a refusal code"
  coupling_warm_start: "the message of a trace `initializer_candidate` solve event (application/coupled_run.py `solve_coupled`; X02 note §5.9); solve events gain no explanation (MSG note §3.3), so nothing renders it; its twins `compatible_warm_start(…)` and `warm_start_rejected(…)` are built from constants and have no entry either"
  k03_kind_bound: "a variable-bound reason label (studies/nlp/revision_host.py `RevisionNlpHost.bounds`, OPT design §4.2.3) in the optimisation report's `formulation.bounds.<name>.reason`; no optimisation report is rendered (MSG note §3.3), so nothing renders it"
  no_declared_bound: "a variable-bound reason label (studies/nlp/revision_host.py `RevisionNlpHost.bounds`, OPT design §4.2.3) in the optimisation report's `formulation.bounds.<name>.reason`; no optimisation report is rendered (MSG note §3.3), so nothing renders it"
  phase_row_not_closure_test: "a V4 verification-check detail label (studies/nlp/verification.py, OPT design §9.3 A-3) in the candidate verification, never a rendered message"
  not_continuable: "a revision-continuation refusal reason label (application/revision_continuation.py A3, RRC design §5.3, §5.4) in `solve-path.json`'s `revision_continuation` member and the trace's `initializer_rejected` event; the restart follows, never a message"
  source_binding: "a revision-continuation refusal reason label (application/revision_continuation.py A2, RRC design §5.3) in `solve-path.json`'s `revision_continuation` member and the trace's `initializer_rejected` event; the restart follows, never a message"
  source_identity: "a revision-continuation refusal reason label (application/revision_continuation.py A2, RRC design §5.3) in `solve-path.json`'s `revision_continuation` member and the trace's `initializer_rejected` event; the restart follows, never a message"
