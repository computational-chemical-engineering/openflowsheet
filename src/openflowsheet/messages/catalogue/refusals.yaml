  - code: pressure_rise
    family: refusal
    kind: input
    complete: true
    title: An outlet pressure above the inlet pressure of a unit that can only lower it
    args: [machine]
    # Review Q1 (WO-5a): the bound's detail line (`machines.py`, `valve.py`; P5).
    detail_pattern: 'P_spec = (?P<p_spec>[-+]?[0-9]+(?:\.[0-9]+)?(?:e[-+]?[0-9]+)?) Pa (?:is above|is below|exceeds) the inlet''s (?P<p_inlet>[-+]?[0-9]+(?:\.[0-9]+)?(?:e[-+]?[0-9]+)?) Pa'
    params:
      machine: {type: text, label: machine}
      unit:    {type: unit, optional: true}
      p_spec:  {type: quantity, optional: true, label: specified outlet pressure, unit: Pa, quantity_kind: pressure}
      p_inlet: {type: quantity, optional: true, label: inlet pressure, unit: Pa, quantity_kind: pressure}
    summary: "The outlet pressure specified for[ unit {unit},] a {machine!raw}, is above its inlet pressure[ ({p_spec} against {p_inlet})]."
    why: "A turbine expands the fluid that passes through it, so it can only lower the pressure. Raising the pressure takes a pump or a compressor."
    variants:
      # Review M2: `pressure_rise(valve)` (`thermal/valve.py`, `syn001/valve.py`).
      - when: {equals: {machine: valve}}
        why: "A valve throttles the fluid that passes through it, so it can only lower the pressure. Raising the pressure takes a pump or a compressor."
    action: "Give the {machine!raw}[ {unit}] an outlet pressure at or below its inlet pressure[ of {p_inlet}], or raise the pressure upstream of it (for example a pump's outlet pressure)."
    examples:
      - chain: [INITIALIZATION_FAILED, initializer_failed, pressure_rise]
        params: {machine: turbine, unit: T,
                 p_spec: {value: 5000000.0, unit: Pa, kind: pressure},
                 p_inlet: {value: 3000000.0, unit: Pa, kind: pressure}}
      - chain: [INITIALIZATION_FAILED, initializer_failed, pressure_rise]
        params: {machine: valve, unit: V,
                 p_spec: {value: 200000.0, unit: Pa, kind: pressure},
                 p_inlet: {value: 100000.0, unit: Pa, kind: pressure}}
