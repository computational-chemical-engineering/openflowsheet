  - code: pressure_fall
    family: refusal
    kind: input
    complete: true
    args: [machine]
    # Review Q1 (WO-5a): the bound's detail line (`machines.py`, `syn001/pump.py`; P5).
    detail_pattern: 'P_spec = (?P<p_spec>[-+]?[0-9]+(?:\.[0-9]+)?(?:e[-+]?[0-9]+)?) Pa (?:is above|is below|exceeds) the inlet''s (?P<p_inlet>[-+]?[0-9]+(?:\.[0-9]+)?(?:e[-+]?[0-9]+)?) Pa'
    params:
      machine: {type: text, label: machine}
      p_spec:  {type: quantity, optional: true, label: specified outlet pressure, unit: Pa, quantity_kind: pressure}
      p_inlet: {type: quantity, optional: true, label: inlet pressure, unit: Pa, quantity_kind: pressure}
      unit:    {type: unit, optional: true}
    # MSG WO-12 (M1). Emitters: `syn001/pump.py` (pump), `thermal/machines.py` `_bound_code` (every
    # machine but the turbine: pump, compressor).
    title: An outlet pressure below the inlet pressure of a machine that can only raise it
    summary: "The outlet pressure specified for[ unit {unit},] a {machine!raw}, is below its inlet pressure[ ({p_spec} against {p_inlet})]."
    why: "A pump or a compressor does work on the fluid to raise its pressure, so its outlet pressure cannot be below its inlet pressure. Lowering the pressure takes a valve or a turbine."
    action: "Give the {machine!raw}[ {unit}] an outlet pressure at or above its inlet pressure[ of {p_inlet}], or lower the pressure upstream of it."
    see_also: [pressure_rise]
    examples:
      - chain: [INITIALIZATION_FAILED, initializer_failed, pressure_fall]
        params: {machine: pump, unit: P,
                 p_spec: {value: 50000.0, unit: Pa, kind: pressure},
                 p_inlet: {value: 100000.0, unit: Pa, kind: pressure}}
