  - code: out_of_domain
    family: refusal
    kind: input
    complete: true
    title: A state outside the range of the property method
    # Review Q1 (WO-5a): the provider's own message (P4), e.g. `iapws95.py`'s `out_of_domain:
    # temperature 200.0 K outside [273.16, 1273.15] K`.
    detail_pattern: '(?P<what>temperature|pressure) (?P<value>[-+]?[0-9]+(?:\.[0-9]+)?(?:e[-+]?[0-9]+)?) (?P<value_unit>K|Pa) outside \[(?=[-+]?[0-9]+(?:\.[0-9]+)?(?:e[-+]?[0-9]+)?, [-+]?[0-9]+(?:\.[0-9]+)?(?:e[-+]?[0-9]+)?\] (?P<low_unit>K|Pa))(?P<low>[-+]?[0-9]+(?:\.[0-9]+)?(?:e[-+]?[0-9]+)?), (?P<high>[-+]?[0-9]+(?:\.[0-9]+)?(?:e[-+]?[0-9]+)?)\] (?P<high_unit>K|Pa)'
    params:
      unit:   {type: unit, optional: true}
      detail: {type: text, optional: true, label: property method's message}
      what:   {type: text, optional: true}
      value:  {type: quantity, optional: true, label: value asked for}
      low:    {type: quantity, optional: true, label: lower end of the range}
      high:   {type: quantity, optional: true, label: upper end of the range}
    summary: "A property calculation[ for unit {unit}] was asked for a state outside the range its property method covers."
    why: "A property method is valid only over a stated range of temperature and pressure, and outside it OpenFlowsheet stops instead of extrapolating.[ The method reported: {detail!raw}.] For example, water's IAPWS-95 method in this version covers 273.16 K to 1273.15 K and 100 Pa to 100 MPa."
    action: "Check the temperatures and pressures specified for the streams[ that reach {unit}], for example a feed below the freezing point, and bring them inside the property method's range; the limitations page lists the range of each method."
    variants:
      # Review S1: a solve's iterate, not a specified state, left the range.
      - when: {outer: [ACTIVE_SET_CYCLING, ATTEMPTS_EXHAUSTED, BOUND_BLOCKED, BUDGET_EXHAUSTED, COUPLING_NOT_CONVERGED, EVALUATION_ERROR, HOMOTOPY_STALLED, INNER_SOLVE_INCONSISTENT, LINEAR_SOLVE_FAILED, LINE_SEARCH_FAILED, PTC_STALLED, RECYCLE_STAGNATION, STAGNATION]}
        kind: numerical
        action: "The solver reached a state outside the property method's range[ at unit {unit}] while iterating; the specified states may all be inside it. Give initial guesses closer to the expected solution, or check the specifications that drive the solve towards that state; the limitations page lists the range of each method."
      - when: {has: [what, value, low, high]}
        why: "A property method is valid only over a stated range of temperature and pressure, and outside it OpenFlowsheet stops instead of extrapolating. Here the {what!raw} {value} is outside the method's range of {low} to {high}."
    see_also: [initializer_failed]
    examples:
      - chain: [INITIALIZATION_FAILED, initializer_failed, out_of_domain]
        params: {unit: P, what: temperature,
                 value: {value: 200.0, unit: K, kind: null},
                 low: {value: 273.16, unit: K, kind: null},
                 high: {value: 1273.15, unit: K, kind: null}}
      - chain: [LINE_SEARCH_FAILED, out_of_domain]
        params: {unit: B}
