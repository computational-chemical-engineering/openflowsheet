    params:
      column: {type: text, label: value left free}
      object: {type: element, optional: true, label: where a specification would fix it}
    summary: "The revision is incomplete: no specification fixes {column!raw}[ (on {object})]."
    why: "A solve needs every value its units leave free to be fixed by exactly one specification. Here {column!raw} is left free, so the equations do not determine the state."
