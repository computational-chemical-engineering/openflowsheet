  - code: isentropic_state_single_phase
    family: refusal
    kind: not_supported
    complete: true
    # MSG WO-12 (M1). Emitters: `thermal/machines.py` (with the unit), `thermal/blocks.py` and
    # `thermal/kernel.py` `isentropic_state`/`_isentropic_temperature` (R-839).
    title: A machine whose ideal outlet is single-phase, unlike its declared outlet
    args: [unit]
    params: {unit: {type: unit, optional: true}}
    summary: "The machine[ {unit}] needs a case this version does not support: its ideal (isentropic) outlet state is single-phase, not the phase declared for its outlet."
    why: "This version computes a machine's ideal outlet in the phase declared for the real outlet. Here the outlet is declared wet (\"vapor_liquid\") but the ideal outlet lies outside the two-phase region, or, where the fluid has no two-phase region at the outlet pressure, the ideal outlet is of another phase than the one declared. This is a limitation of the software, not an error in your flowsheet."
    action: "Declare the outlet with the phase its ideal state has (for example vapour when the ideal state is superheated) if the real outlet has that phase too; otherwise change the operating conditions until the ideal and the real outlet are in the same phase."
    gap: {limitation: null, capability: "an ideal (isentropic) outlet of another phase than the declared outlet"}
    see_also: [isentropic_state_two_phase, phase_regime_mismatch]
    examples:
      - chain: [INITIALIZATION_FAILED, initializer_failed, isentropic_state_single_phase]
        params: {unit: T}
      - params: {}
