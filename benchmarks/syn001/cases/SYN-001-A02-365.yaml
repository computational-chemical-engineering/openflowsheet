# SYN-001 ProcessRevision: SYN-001-A02-365
#
# T02's cross-unit specification [A02] inside SYN-001: the heater outlet temperature is freed and
# the flash duty specified. See docs/derivations/T02-recycle-spec.md §7. Validates against
# schemas/process-revision.schema.json.
schema_version: 1
revision_id: SYN-001-A02-365-r1
parent_revision: null
title: 'Cross-unit specification: flash duty -26111.610060 W, heater outlet temperature freed (guess 358
  K)'
description: 'T02''s A02 instance inside SYN-001 (docs/derivations/T02-recycle-spec.md §7.3): the nominal
  revision with the heater''s outlet-temperature specification replaced by a free variable, and the flash
  duty specified instead. The heater and the downstream energy balance are one EO region. Expected outcome:
  T_heater = 365 K.'
component_set:
  record_source: benchmarks/syn001/components.yaml
  components:
  - A
  - B
  - C
instances:
- id: feed
  model:
    id: syn001.feed_source
    version: 0.0.0-declared
    artifact_ref: null
  semantic_role: feed
  parameters: {}
  policy:
    fidelity: boundary condition; the fresh feed state is fully specified
    validity: SYN-001 declared domain 280-440 K, 50000-200000 Pa
- id: mixer
  model:
    id: syn001.adiabatic_mixer
    version: 0.0.0-declared
    artifact_ref: null
  semantic_role: mixer
  parameters:
    pressure_drop:
      value: 0.0
      unit: Pa
      dimension:
      - -1
      - 1
      - -2
      - 0
      - 0
      - 0
      - 0
      kind: pressure
      meaning: Declared pressure drop across the mixer; zero in SYN-001, imposed as an equation P_out
        = P_in rather than assumed (ADR 0001 D4.5)
      role: fixed
  policy:
    fidelity: adiabatic component and energy balance; enthalpy closure by a bracketed scalar thermal solve
    validity: v0.0 restricts the closure to the subcooled-liquid domain with a typed failure outside it
      (plan §3.2)
- id: heater
  model:
    id: syn001.tp_heater
    version: 0.0.0-declared
    artifact_ref: null
  semantic_role: heater
  parameters:
    pressure_drop:
      value: 0.0
      unit: Pa
      dimension:
      - -1
      - 1
      - -2
      - 0
      - 0
      - 0
      - 0
      kind: pressure
      meaning: Declared pressure drop across the heater; zero in SYN-001, imposed as an equation P_out
        = P_in rather than assumed (ADR 0001 D4.5)
      role: fixed
  policy:
    fidelity: 'TP-state outlet: a TP flash at the specified outlet temperature with the duty as a calculated
      unknown of either sign'
    validity: SYN-001 declared domain; a two-phase outlet is a supported result
- id: flash
  model:
    id: syn001.tp_flash
    version: 0.0.0-declared
    artifact_ref: null
  semantic_role: flash
  parameters:
    pressure_drop:
      value: 0.0
      unit: Pa
      dimension:
      - -1
      - 1
      - -2
      - 0
      - 0
      - 0
      - 0
      kind: pressure
      meaning: Declared pressure drop across the flash; zero in SYN-001, imposed as an equation P_out
        = P_in rather than assumed (ADR 0001 D4.5)
      role: fixed
  policy:
    fidelity: isothermal-isobaric equilibrium flash sharing the heater's TP-state kernel; duty calculated
    validity: SYN-001 declared domain; single-phase and zero-flow results are supported outcomes, not
      failures (ADR 0001 D3.4)
- id: splitter
  model:
    id: syn001.stream_splitter
    version: 0.0.0-declared
    artifact_ref: null
  semantic_role: splitter
  parameters:
    split_fraction:
      value: 0.5
      unit: '1'
      dimension:
      - 0
      - 0
      - 0
      - 0
      - 0
      - 0
      - 0
      kind: dimensionless
      meaning: Fraction r of the flash liquid returned to the mixer; the purge takes 1 - r. Pinned by
        specification SPEC-splitter-r.
      role: fixed
      bounds:
        lower: 0.0
        upper: 1.0
  policy:
    fidelity: linear split at constant T, P and composition
    validity: 0 <= r < 1; r = 1 has no steady state (derivation §5)
- id: vapor_product
  model:
    id: syn001.product_sink
    version: 0.0.0-declared
    artifact_ref: null
  semantic_role: product_sink
  parameters: {}
  policy:
    fidelity: boundary; accepts a stream and imposes no equation on it
    validity: accepts any phase signature including ZERO_FLOW
- id: purge
  model:
    id: syn001.product_sink
    version: 0.0.0-declared
    artifact_ref: null
  semantic_role: product_sink
  parameters: {}
  policy:
    fidelity: boundary; accepts a stream and imposes no equation on it
    validity: accepts any phase signature including ZERO_FLOW
connections:
- id: S1
  kind: material
  from:
    instance: feed
    port: outlet
  to:
    instance: mixer
    port: inlet
  state_definition: nTP-v1
  component_mapping: revision_component_set
  phase_capability: liquid
  notes: 'Fresh feed: (1, 1, 1) mol/s at 300 K and P_r, liquid (derivation §4).'
- id: S2
  kind: material
  from:
    instance: mixer
    port: outlet
  to:
    instance: heater
    port: inlet
  state_definition: nTP-v1
  component_mapping: revision_component_set
  phase_capability: liquid
  notes: Adiabatic mixer outlet. The v0.0 closure is restricted to the subcooled-liquid domain; derivation
    §7 finding 5 shows no registered r-variant leaves it.
- id: S3
  kind: material
  from:
    instance: heater
    port: outlet
  to:
    instance: flash
    port: inlet
  state_definition: nTP-v1
  component_mapping: revision_component_set
  phase_capability: vapor_liquid
  notes: Heater outlet at the specified temperature. Two-phase in three of the five registered variants
    (derivation §7 finding 2), which is a supported result.
- id: S4
  kind: material
  from:
    instance: flash
    port: vapor
  to:
    instance: vapor_product
    port: inlet
  state_definition: nTP-v1
  component_mapping: revision_component_set
  phase_capability: vapor
  notes: Vapor product. Exactly zero flow in the 310 K variant; ZERO_FLOW is a phase signature, not a
    failure (ADR 0001 D3.4).
- id: S5
  kind: material
  from:
    instance: flash
    port: liquid
  to:
    instance: splitter
    port: inlet
  state_definition: nTP-v1
  component_mapping: revision_component_set
  phase_capability: liquid
  notes: Flash liquid at the flash temperature and pressure.
- id: S6
  kind: material
  from:
    instance: splitter
    port: recycle
  to:
    instance: mixer
    port: inlet
  state_definition: nTP-v1
  component_mapping: revision_component_set
  phase_capability: liquid
  notes: Liquid recycle. Its T and P are known from the flash specification, so the tear needs only its
    three component flows; T01 must rediscover that from the incidence graph rather than have it hard-coded
    (plan §3.2).
- id: S7
  kind: material
  from:
    instance: splitter
    port: purge
  to:
    instance: purge
    port: inlet
  state_definition: nTP-v1
  component_mapping: revision_component_set
  phase_capability: liquid
  notes: Purge. Together with S4 it carries the whole external product balance.
