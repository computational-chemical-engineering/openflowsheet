# X06 (ADR 0078 D4.5; ADR 0025 D2.3): the `sha256`-bearing property names that X06's response schema
# adds. A separate table beside F3's, so that the registered numerical policies keep their ids and
# their contents (M02's precedent; R-1032's structure; X06 decision X06-CI1-1 in
# `docs/X06_DECISIONS.md`).
#
# Read by `scripts/t08_numerical_policy.py --check` (the closed partition of `sha256` names, one
# addendum after another). A registration result carries no floats: the table carries no `rules`.
numerical_policy_external:
  id: X06-numerical-policy-external-v1
  schemas:
  # The `SolvePolicies` responses, reached from `application-results` by bare `$ref`s.
  - solve-policy-results.schema.json
  # Exact digests (ADR 0007 D1, digest row; ADR 0025 D2): each preimage is a solve-policy
  # document's canonical bytes, declared data, never a solved value. `policy_sha256` is classified
  # exact by v2.
  # - `expected_sha256`: the canonical bytes' SHA-256 of the document a conflicting request carries.
  # - `actual_sha256`: the SHA-256 of the bytes the id is already bound to (D4.5).
  exact_sha256:
  - actual_sha256
  - expected_sha256
