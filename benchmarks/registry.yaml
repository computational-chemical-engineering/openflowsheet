      pressure: { value: 100000.0, unit: Pa }
      duty: { value: 100000.0, unit: W }
    initializer:
      id: SYN-001-tear-init-v2
      rule: "t0 = G(0): one traversal from a dormant recycle; r * liquid of the flash of F at (T_f, P); equals (1 - r) t*"
      tear_variables: ["recycle.n[A]", "recycle.n[B]", "recycle.n[C]"]
      values_mol_per_s: [0.0, 0.0, 0.0]
      note: >-
        G(0) is dormant at r = 0 and coincides with t*. Exactly zero is a valid iterate: tear
        variables are component flows bounded below by 0 and must be able to reach zero, so no
        positive log transform may be used (ADR 0001 D3.5, D3.6).
    budgets: { property_calls: 10000, newton_iterations_per_attempt: 50, attempts: 5 }
    expected:
      outcome: oracle_values
      in_success_denominator: true
      flash_phase_state: TWO_PHASE
      heater_outlet_state: TWO_PHASE
      mixer_outlet_state: LIQUID
      recycle_phase_signature: ZERO_FLOW
      purge_phase_signature: LIQUID
      vapor_product_phase_signature: VAPOR
      notes: >-
        Registered phase-appearance case: the equimolar feed is above its 347.44 K bubble point
        at 350 K, so the heater outlet is two-phase. The recycle has exactly zero flow, not a
        small flow.

