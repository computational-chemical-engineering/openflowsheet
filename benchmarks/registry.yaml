# ================================================================================================
# T06 (W4): the v0.1 corpus, its policies, the robustness ensemble and the reference fixtures.
# Authority: docs/derivations/T06-corpus-spec.md as amended (Amendment 1) §3, §6, §7, §9, §17 W4;
# ADR 0014 (+ Amendment 1), ADR 0015; register R-066…R-080. Values: benchmarks/t06/reference_values.yaml.
#
# The corpus is a different object from `cases` above (spec §18 finding 1): `cases` are registry
# rows, one per executable fixture, with their own denominator; a corpus case is a distinct failure
# mechanism, registered once, that names a fixture (a revision, a reference key or a test node),
# and it is counted by its own preregistered rule (spec §3.1): the success denominator is the cases
# of kind `verified_at_reference` or `converged_to_closed_form`. `id`, `class`, `fixture`,
# `path`, `eligible`, `in_success_denominator` and `expected.outcome` are the twin's `corpus.cases`
# row verbatim (T6-A01, tests/test_t06_w5_corpus.py); everything else is §3.2's row.
# ================================================================================================

