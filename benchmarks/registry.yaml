#: Spec §6-§7: the robustness ensemble's definition, registered before any start is generated or
#: solved. The starts file does not exist yet (work order M7/W6): its hash is recorded here when it
#: is generated, before any solve, and every platform scores those starts (§6.5).
ensemble:
  id: T06-ens-v1
  specification: docs/derivations/T06-corpus-spec.md §6, §7 (Amendments 1 and 2)
  profile: nominal
  cases: [STR-01, STA-01, STA-02, STA-05, NUM-03, THM-01, THM-02, THM-03, THM-07, THM-08, THM-09, THM-10, NET-01, NET-02, NET-03, NET-05, NET-06, NET-07, NET-08, NET-09, NET-10, NET-11]
  starts_per_case: 20
  N: 440
  gate:
    S_min: 418
    fraction: "0.950"
    estimator: point estimate (Frank, Q7, 2026-09-26); the Clopper-Pearson one-sided 95% lower bound is reported, never gated
    machine_classes: [ref-x86-64, ci-aarch64]
  law:
    rng: sha256-counter-v1
    key: "T06-ens-v1|<profile>|<case id>|<start:02d>|<joint:02d>|<coordinate id>|<attempt:02d>"
    u: the first 8 bytes of SHA-256 of the key (UTF-8), big-endian, shifted right by 11, times 2^-53
    delta: "(2u - 1) / 5: 2u - 1 exact, one correctly rounded division (spec §6.3 (A2)); not the binary64 product 0.2 * (2u - 1)"
    start: x_init + S * delta on the selected coordinates (spec §6.2), two roundings (the product, then the sum), no FMA
    known_answers: benchmarks/t06/reference_values.yaml closed_form.draw_known_answers
  coordinates_rule: >-
    Spec §6.2 per path: tear, the three tear flows S6.n.A/B/C; legacy EO with a freed guess
    (NET-05), the freed guess S3.T; revision EO, every stream coordinate and every unit-owned
    scalar no fixed specification pins, with lifted splits recomputed by initial_state's step 5;
    a component absent from every feed and reaction is held at +0.0 and not selected.
  scales: {flow_mol_per_s: 3.0, temperature_K: 100.0, pressure_Pa: 100000.0, duty_and_work_W: 100000.0}
  domain: {temperature_K: [280.0, 440.0], pressure_Pa: [50000.0, 200000.0], flows: ">= 0"}
  caps: {coordinate_attempts: 64, joint_attempts: 64}
  policies:
    revision_eo: T06-revision-v2
    tear: SYN-001-K03
    legacy_eo: T04-W12
  #: Spec §6.6 (A4), A95: run 1 scored the revision path under T06-revision-v1; its record stands
  #: in the campaign manifest. Every run from run 2 on runs `policies` above.
  run_1:
    policies:
      revision_eo: T06-revision-v1
      tear: SYN-001-K03
      legacy_eo: T04-W12
  budgets: {property_calls: 10000, newton_iterations_per_attempt: 50, attempts: 5, eo_recovery_max_count: 1}
  cache_condition: {property_cache: fresh_per_start, warm_start_cache: none, compiled_problem: fresh_per_start}
  #: Spec §7.5 (A5), R-090: the machine classes, decided from the host by the harness's
  #: `machine_class()` (never `generator.py`'s literal): the first class whose `github_actions`
  #: flag is whether GITHUB_ACTIONS=true, whose architecture is platform.machine(), and whose
  #: cpu_model, where one is registered, is /proc/cpuinfo's; anything else is
  #: unregistered(<machine>), reported and never gated. `runner` is the CI job's.
  machine_classes:
    ref-x86-64: {github_actions: false, architecture: x86_64, cpu_model: AMD Ryzen Threadripper PRO 5965WX 24-Cores}
    ci-x86-64: {github_actions: true, architecture: x86_64, runner: ubuntu-latest}
    ci-aarch64: {github_actions: true, architecture: aarch64, runner: ubuntu-24.04-arm}
  time_ceiling_s: 60
  rescued_starts: counted as successes and reported per case (Frank, 2026-09-26; spec §7.1, §7.4, A66)
  starts_file: benchmarks/t06/ensemble/starts-nominal-v1.json
  #: Spec §6.5: generated once on ref-x86-64 (M7, 2026-09-26) by benchmarks/t06/generator.py
  #: before any ensemble solve; every platform scores these starts and never regenerates them.
  #: Re-emitted once by the same generator (spec §6.5 (A3), A3.11, W16) for ADR 0017's provider
  #: hash alone: the only differing path from 641de215… is /provider/implementation_sha256.
  starts_sha256: 3a7bd49c66493744753d1eac554101317c931e0ef51d9154d6f7cab3124fef82
  generator: benchmarks/t06/generator.py
  #: Spec §6.6 (A5), §7.5 (A5), A95, A97 (e); R-090: the committed run files under
  #: benchmarks/t06/ensemble/runs/ (listed in its SHA256SUMS), unedited. Runs 1 and 2 are the
  #: verdicts' §0 bytes (docs/reviews/T06-verdicts.md). Their format is v1, whose host block says
  #: machine_class ref-x86-64 on every host (the pre-A5 literal, the verdicts' P2): a v1 entry's
  #: class is recorded from the file's `architecture` and its CI job (`ci_run`, `ci_runner`, the
  #: class's registered `runner`); a v2 entry's is the file's host.machine_class. The headline
  #: (S, S_first, S_rescued, gate) recomputes from the file's records with the harness's `report`.
  #: The gate verdict is run 2's (spec §7.3 (A5)); run 1's FAIL stands (R-087).
  runs:
