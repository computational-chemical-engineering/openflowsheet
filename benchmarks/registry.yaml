cases:
  - case_id: SYN-001-nominal
    family: SYN-001
    class: nominal, recycle
    revision: benchmarks/syn001/cases/SYN-001-nominal.yaml
    fresh_feed:
      components: [A, B, C]
      n_mol_per_s: [1.0, 1.0, 1.0]
      phase: LIQUID
    T_feed_K: 300.0
    T_heater_K: 350.0
    T_flash_K: 360.0
    P_Pa: 100000.0
    r: 0.5
    oracle: benchmarks.syn001.oracle.recycle_oracle
    reference: benchmarks/syn001/reference_values.yaml
    independence: >-
      algebraic reference for the synthetic model; not an experimental validation or a simulator
      benchmark result
    tolerances:
      component_balance: { absolute: 1.0e-9, relative: 1.0e-8, scale: 3.0, unit: mol/s }
      energy_balance: { absolute: 1.0e-5, relative: 1.0e-8, scale: 100000.0, unit: W }
      temperature: { absolute: 1.0e-6, unit: K }
      pressure: { absolute: 1.0e-2, unit: Pa }
      normalized_composition: { absolute: 1.0e-10, unit: "1" }
    scales:
      tear_component_flow: { value: 3.0, unit: mol/s }
      temperature: { value: 100.0, unit: K }
      pressure: { value: 100000.0, unit: Pa }
      duty: { value: 100000.0, unit: W }
    initializer:
      id: SYN-001-tear-init-v2
      rule: "t0 = G(0): one traversal from a dormant recycle; r * liquid of the flash of F at (T_f, P); equals (1 - r) t*"
      tear_variables: ["recycle.n[A]", "recycle.n[B]", "recycle.n[C]"]
      values_mol_per_s: [0.14888835696525697, 0.27319848846280806, 0.39750861996035915]
      note: >-
        A registered starting guess, not a converged answer; equals (1 - r) t* by the affine-ray
        relation, so a Newton from it lands on t* in one step and this case exercises no
        globalization (K03 spec §10.2). A poor guess is not proof that the specified process is
        impossible (blueprint §4.3).
    budgets: { property_calls: 10000, newton_iterations_per_attempt: 50, attempts: 5 }
    expected:
      outcome: oracle_values
      in_success_denominator: true
      flash_phase_state: TWO_PHASE
      heater_outlet_state: LIQUID
      mixer_outlet_state: LIQUID
      recycle_phase_signature: LIQUID
      purge_phase_signature: LIQUID
      vapor_product_phase_signature: VAPOR
      notes: >-
        Every numeric field is compared against the variant of the same case_id in
        reference_values.yaml.

