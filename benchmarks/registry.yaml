families:
  - id: SYN-001
    title: Synthetic three-component ideal flash-recycle fixture
    kind: synthetic
    derivation: docs/derivations/SYN-001.md
    specification: docs/derivations/SYN-001-oracle-spec.md
    semantics: docs/adr/0001-state-units-zero-flow.md
    components: benchmarks/syn001/components.yaml
    oracle: benchmarks.syn001.oracle.recycle_oracle
    reference: benchmarks/syn001/reference_values.yaml
    reference_sha256: 1e70fc3a41dd7215e447f81974f6f993e08f1885412ed9171cd4769646fb3668
    reference_author: "Fable 5.1, mpmath 1.3.0 at 40 significant digits, from plan §3.1 definitions only"
    independence: >-
      algebraic reference for the synthetic model; not an experimental validation or a simulator
      benchmark result
    independence_limits: >-
      The oracle and any solver compared against it share the SYN-001 thermodynamics, so an
      agreement verifies algebra and bookkeeping, not enthalpy data (blueprint amendment [A09]).
      The 20-digit reference values are independent of the oracle implementation: they were
      generated by docs/derivations/scripts/syn001_reference.py from the plan §3.1 definitions
      and must never be regenerated from the oracle.
    property_domain:
      temperature_K: { min: 280.0, max: 440.0 }
      pressure_Pa: { min: 50000.0, max: 200000.0 }
      note: >-
        Declared test domain. No critical-region or extra-phase claim is made; outside it the
        provider returns a typed domain failure.
    reference_convention: SYN-001-ref-v1
    state_definition: nTP-v1
    recycle_case_group: SYN-001-flash-recycle
    recycle_case_group_note: >-
      The r-variants are one recycle case, not three: derivation §5.1 proves the loop reduces to
      a single flash of the fresh feed, so the tear map stresses throughput scaling only. T06
      must count them once and must add a thermally coupled recycle (NET-07) for genuine
      composition-energy coupling (plan §3.2, §4.3).
    tolerances:
      source: docs/derivations/SYN-001.md §9 (adopted in ADR 0001 D6)
      applicability: >-
        Preimplementation choices for this synthetic fixture only, confirmed in P01 against
        oracle accuracy. They are not applied to any real process (blueprint §8.1).
      component_balance: { absolute: 1.0e-9, relative: 1.0e-8, scale: 3.0, unit: mol/s }
      energy_balance: { absolute: 1.0e-5, relative: 1.0e-8, scale: 100000.0, unit: W }
      temperature: { absolute: 1.0e-6, unit: K }
      pressure: { absolute: 1.0e-2, unit: Pa }
      normalized_composition: { absolute: 1.0e-10, unit: "1" }
    scales:
      source: docs/derivations/SYN-001.md §9
      note: >-
        Registered physical nominals. Scales are never derived from an iterate value, which may
        be exactly zero (ADR 0001 D3.5); K03 fixes the scale construction that consumes them.
      tear_component_flow: { value: 3.0, unit: mol/s }
      temperature: { value: 100.0, unit: K }
      pressure: { value: 100000.0, unit: Pa }
      duty: { value: 100000.0, unit: W }
    budgets:
      property_calls: 10000
      newton_iterations_per_attempt: 50
      attempts: 5
      note: >-
        Preregistered defaults (blueprint §13.4), refined in K03. Exceeding a budget is a typed
        failure with no certificate, not a degraded success.

