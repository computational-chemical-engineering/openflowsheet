# Benchmark registry: case semantics, tolerances, generator, budgets and reference identity
# (implementation plan §1.2, §3.3; blueprint v3.1 §13, amendment [A04]).
#
# Introduced by P01 with the SYN-001 family only. Registration and reference-comparison
# verdicts are Fable-led (plan §1.3); this file records the cases the P01 specification names
# (docs/derivations/SYN-001-oracle-spec.md §3) so they can be executed and counted. A case that
# cannot be reproduced is documented as unavailable; counts are never silently reduced.
#
# Every case here is synthetic. None of it is an experimental validation or a simulator
# benchmark result. Two of the eight cases have an expected *outcome type* rather than expected
# values and sit outside the success denominator: they must fail, in a specific typed way.
#
# T06 (W4) adds four sections after `cases`: `policies` (every policy a T06 registration names,
# by canonical hash), `corpus` (the 49 corpus cases, docs/derivations/T06-corpus-spec.md §3),
# `ensemble` (the robustness ensemble's definition, §6-§7) and `reference_fixtures` (§9.2).

