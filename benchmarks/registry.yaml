      recycle_phase_signature: ZERO_FLOW
      purge_phase_signature: ZERO_FLOW
      vapor_product_phase_signature: VAPOR
      notes: >-
        Sum z_i/K_i = 0.317 at 420 K. Liquid, purge and recycle are all exactly dormant, and the
        case is r-independent (derivation §7 finding 7).

