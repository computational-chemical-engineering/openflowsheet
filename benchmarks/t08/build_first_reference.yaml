criterion:
  classes:
    LOW: solve outcome CONVERGED and final state within the radius of the LOW root
    MID: solve outcome CONVERGED and final state within the radius of the MID root
    HIGH: solve outcome CONVERGED and final state within the radius of the HIGH root
    FAIL: any other outcome, or CONVERGED and within no root's radius
  distance: max(|x1 - x1*|, |x2 - x2*|), x1 = 1 - n_B/0.5, x2 = (T - 360)/3.125
  reached_set: 'S_a = { starts g : class_a(g) in {LOW, HIGH} }'
  b1_containment: PASS iff there is a start g with g in S_ptc and g not in S_newton
  saddle_clause: PASS iff class_ptc(g) != MID for every one of the 441 starts
  mechanism: 'T08.B14: the implementation''s step matrix at the saddle is singular at dtau = theta / s_plus'
  route_a: T08.B11-B15 pass
  arms:
    newton: T06-revision-v2 with globalization.eo_core = newton, eo_recovery = none
    ptc: T06-revision-v2 with globalization.eo_core = ptc, eo_recovery = none, ptc = T04 spec 7.7 constants
  budgets:
    newton_max_iterations_per_attempt: 50
    ptc_max_steps_per_attempt: 200
    max_attempts: 5
    max_property_calls: null
    wall_time: null
  tolerances: the region's KIND_TOLERANCE rows (unchanged); no tolerance is added
  start_entry: execute_plan(user_start=<start over every spec.variable_ids>), T06 W6
  trace_component: C at 2^-10 mol/s in the feed and every start (S1.n.C = S2.n.C = 0.0009765625); every
    run ends with S1.n.C and S2.n.C within 1e-12 mol/s of it and no rejection names a C column (T08.B21,
    Amendment 1)
