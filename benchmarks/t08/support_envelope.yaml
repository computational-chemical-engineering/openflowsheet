    title: Unit models
    statement: >-
      The twenty-three models of `MODEL_BUILDERS`, each with its registered limitations (L02,
      L27–L31, L-CSTR-1..3, L-COL-1..10; the surrogate's Q0–Q7): SYN-001's thirteen, on SYN-001's
