    evidence:
      - tests/test_t08_w2_unsupported.py::test_u13_no_mode_b_artifact_is_tracked
      - doc:docs/adr/0006-distribution-data-rights.md §D1

  - id: U14
    capability: External benchmark comparisons (CRAFTS / OpenIDAES-450)
    outcome: >-
      No comparison is run (W27's campaign is M07's, R-175). v0.2's adaptation records (provenance,
