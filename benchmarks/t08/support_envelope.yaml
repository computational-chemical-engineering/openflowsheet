      - tests/test_t08_w2_inventory.py::test_a32_every_component_record_is_synthetic_or_a_vetted_real_record_with_rights
      - doc:docs/adr/0006-distribution-data-rights.md §D1
  - id: L41
    text: >-
      A bundle written by an installed package (wheel or sdist, not the source checkout) carries no
      dependency-set identity: the package ships no lock file, so its `lock_sha256` is empty and
      every replay of it is `inspected_archived_results` / `NOT_RUN` ("the dependency set is
      unknown …"); replayable bundles are written from the source checkout at the lock
      `ead4edf1…`.
    evidence:
      - tests/test_t08_r3_a19_lock_lookup.py::test_the_three_states_end_to_end
      - tests/test_t08_r3_a19_lock_lookup.py::test_b_an_installed_layout_beneath_a_stray_lock_has_none
      - doc:docs/adr/0007-reproducibility-certificate-policy.md §D4
      - doc:docs/derivations/T08-release-spec.md §5.5
  - id: L42
    text: >-
      `pr-c1-v1` (Peng–Robinson with the light gases vapour-only, ADR 0026), shipped since M01, is
      bound by the C1 models (`c1.*`) on their own basis (R-288) and does not share the axes'
      components and domain: it takes the five real components H2, N2, NH3, Ar, CH4 (the only
      liquid is pure NH3) over 200–1000 K and 10⁴–3 × 10⁷ Pa. It is validated for pure-component
      behaviour only, within M01 spec §11's bands (NH3 saturation pressure within 2 %, liquid NH3
      and light-gas ln φ within 0.05 of the reference equations of state). There is no mixture
      VLE validation, and k_ij = 0 for every pair: k_H2–NH3 = 0.1 would move the separator's
      vapour NH3 fraction y* by −3.1 % (about 3 % per 0.1; spec §4.2).
    evidence:
      - check:M01.A38
      - check:M01.A39
      - check:M01.A40
      - doc:docs/derivations/M01-spec.md §11
      - doc:docs/derivations/M01-spec.md §4.2
      - doc:docs/derivations/M01-spec.md §17
      - tests/test_m01_provider.py::test_a04_describe_declares_exactly_the_registered_surface
  - id: L43
    text: >-
      The Anderson recycle, its stagnation restart (recovery edge E1) and the stalled-recycle EO
      merge (E2) are library capabilities: every shipped unit that can sit in a loop declares
      exact derivatives, so `auto` resolves to `newton_tear`, and no application-offered policy
      requests `anderson` (`docs/recovery-edges.yaml`, `enabled: library-only`, R-130). V13 (b)'s
      and V14 (c)'s evidence for them is library-level.
    evidence:
      - tests/test_t08_w2_edge_identity.py::test_e1_e2_no_offered_policy_or_unit_reaches_a_recycle_iteration
      - doc:docs/recovery-edges.yaml
  - id: L-WEB-1
    text: >-
      The web shell (`serve-http --ui`) is a diagnostic client of the HTTP binding: it edits
      nothing (Solve and Cancel are its only effects), calls seventeen operations and no other,
      computes only display arithmetic (design note §5.6), converts no unit, and judges nothing —
      the scenario view displays run differences without a registered comparison or allowance.
    evidence:
      - tests/test_m06_static_scan.py::test_the_ui_calls_exactly_the_seventeen_operations
      - doc:docs/web-shell.md
      - doc:docs/design/M06-web-shell.md §5.6
  - id: L-WEB-2
    text: >-
      The web shell's security is the local, single-user model: loopback by default, the bearer
      token on every data request, a strict Content-Security-Policy; no TLS, no multi-user
      hosting, and no security assessment beyond design note §7. Served with `--allow-remote`
      over plain HTTP the page is an insecure context and record digests show "unchecked".
    evidence:
      - tests/test_m06_wo4_serving.py::test_a_shell_file_is_served_with_its_type_and_the_shell_headers
      - doc:docs/design/M06-web-shell.md §7
  - id: L-WEB-3
    text: >-
      The web shell is tested in headless Chromium only. No usability, workflow or screen-reader
      study exists; accessibility is limited to status shown as glyph and word, controls that are
      keyboard-reachable by construction, and the measured contrast of its colour tokens.
    evidence:
      - tests/test_m06_contrast.py::test_every_text_token_on_every_background_is_legible
      - doc:docs/design/M06-web-shell.md §13
  - id: L-WEB-4
    text: >-
      The agent history shows what the project recorded, not what an agent claimed; the
      validation shown beside a commit is recomputed now by the current server, not the report the
      agent received at commit time.
    evidence:
      - doc:docs/web-shell.md
      - doc:docs/design/M06-web-shell.md §12
  # L44–L46, L48: R-343 (M02 close-out), M02's user-facing limitations as E; ids and texts are V02
  # alpha release spec §19.1's (Amendment 3, R-370). L47 is the alpha's (R-377). L49 is M04's (R-365),
  # renumbered from M04's L43 at the alpha's merge into main: the released alpha holds L43 (R-321).
  - id: L44
    text: >-
      The C1 reactor (`c1.reactor`) is measured on Linux x86-64 only, on one machine
      (`ref-x86-64`). Its runs are opt-in: they need the separately built, pinned reactor
      environment, which no CI job builds (M02 N2). They are reproducibility class R3 (ADR 0034
      D6). A run on aarch64 is not measured, nor is the reproduction of a coupled run across
      architectures. macOS is best effort, and Windows is refused before spawn (ADR 0033 D2).
    evidence:
      - doc:docs/design/M02-pymrm-adapter.md §2.4
      - doc:docs/adr/0033-external-model-execution-and-experiment-records.md §D2
      - doc:docs/adr/0034-external-models-in-a-flowsheet-solve.md §D6
      - doc:docs/derivations/V02-alpha-release-spec.md §13
  - id: L45
    text: >-
      `external-subprocess-v1` runs the group's pinned code with the user's privileges and is not
      a sandbox: there is no filesystem confinement, network isolation, memory or CPU quota, or
      syscall filtering, and trust rests on provenance (ADR 0033 D2; M02 N1).
    evidence:
      - doc:docs/adr/0033-external-model-execution-and-experiment-records.md §D2
      - doc:docs/design/M02-pymrm-adapter.md §12
  - id: L46
    text: >-
      No reactor result has been compared with experimental data by this project. The group's
      published comparison (Gargiulo et al. 2025 §3.1, of Rossetti et al. 2006's rate law) is the
      group's evidence. Every real-reactor number is the group's model at the pin, a regression,
      and its discretization bias is 1.0–1.4 % in NH₃ (M02 design note §13).
    evidence:
      - doc:docs/design/M02-pymrm-adapter.md §13
      - doc:docs/derivations/V02-alpha-release-spec.md §6.1
  - id: L47
    text: >-
      `pr-c1-v1`'s saturated-liquid NH₃ volume is 11–30 % high (240–400 K) and its enthalpy of
      vaporization 2–5 % high (−7 % at 400 K), against the reference equations of state. No v0.2
      loop decision uses either.
    evidence:
      - doc:docs/derivations/M01-spec.md §11
  - id: L48
    text: >-
      The C1 loop's convergence is evidenced at the corners and the centre of its registered hard
      domain only (M02 G11). The inert-fraction floor y_inert ≥ 0.035 sits just above a measured
      stage-1 failure (0.03 at 653.15 K, 11 MPa, H₂/N₂ 2.5). A failure inside the domain ends in a
      typed refusal and then `COUPLING_NOT_CONVERGED`, never in a false success.
    evidence:
      - check:M02.G11
      - doc:docs/design/M02-pymrm-adapter.md §13
  - id: L49
    text: >-
      No promotable surrogate of the real C1 reactor exists in v0.2. M04's one real iteration
      (plan `b2-it1` on box v2, reactor variant v3) is NOT_PROMOTABLE (`band_not_finite`): 26 of
      its 632 registered experiments, 5 of them among the 118 calibration draws, end in a
      deterministic `reactor_not_accepted(certificate)`, more than the n − k = 4 refused draws the
      conformal band tolerates, so q̂ is infinite. A revision binds `c1.reactor_surrogate` only
      through a manifest that re-derives PROMOTABLE (R-360), and no further iteration on v3 is
      admissible (R-364).
    evidence:
      - check:M04.A31
      - tests/test_m04_wo9_synthetic_loop.py::test_a48_renaming_the_reactor_onto_the_rough_surrogate_is_rejected
      - doc:benchmarks/m04/wo11-b2-it1-v3/record.json
      - doc:docs/derivations/M04-spec.md §20
  - id: L-S11-1
    text: >-
      `iapws95-v1` (IAPWS-95, S05) is selected by `record_source: benchmarks/s05/components.yaml`
      for the one component H2O, over 273.16–1273.15 K and 10²–10⁸ Pa. Only the routing models
      (`syn001.feed_source`, `syn001.product_sink`, `syn001.stream_splitter`) bind on it; its
      evidence is S05's validation against the IAPWS-95 reference equation (S05 spec).
    evidence:
      - tests/test_s11_routing.py::test_a13_the_admission_matrix
      - tests/test_s11_bases.py::test_a09_the_other_bases_have_their_providers
      - doc:docs/derivations/S05-IAPWS95-spec.md
      - doc:docs/derivations/S11-design.md §4.11
  - id: L-S11-2
    text: >-
      `coolprop-heos-v1` (CoolProp HEOS, S07) is selected by `record_source:
      benchmarks/s07/components.yaml` for exactly one admitted fluid per revision, among the 123
      of S07's table; each fluid keeps S07's tier and domain. Only the routing models bind on it,
      and it needs the `coolprop` extra: without CoolProp installed, binding is refused
      `basis_unavailable(coolprop-heos-v1)`.
    evidence:
      - tests/test_s11_bases.py::test_a09_coolprop_without_its_extra_is_unavailable
      - tests/test_s11_bases.py::test_a06_the_coolprop_records_are_the_generators
      - tests/test_s11_routing.py::test_a13_the_admission_matrix
      - doc:docs/derivations/S07-spec.md
      - doc:docs/derivations/S11-design.md §4.11
  - id: L-S11-3
    text: >-
      `wilson-ig-v2` (S10's Wilson activity model with an ideal-gas vapour; `wilson-ig-v1`'s answers
      with the molar entropy added, S11 units design §4.6) is selected by
      `record_source: benchmarks/s10/records.yaml` for its three record components (CH3OH,
      C2H5OH, H2O, in any order), over 300–400 K and 30–200 kPa. The routing models and the
      column (`syn001.column`, L-COL-1..10) bind on it. Its records are in the source repository
      only, so in a wheel binding is refused `basis_unavailable(wilson-ig-v2)` (R-706, R-811). Premises P1–P3 are checked at binding.
      The S10 VAL-1–3 bands apply, and the VAL-3 latent-heat miss (methanol, +5.72 % against
      5 %) is carried. Results are compared across architectures by tolerance, not bitwise.
    evidence:
      - tests/test_s11_bases.py::test_a09_wilson_without_its_records_is_unavailable
      - tests/test_s11_bases.py::test_a08_the_binder_refuses_unmet_premises
      - tests/test_s11_routing.py::test_a13_the_admission_matrix
      - tests/test_s11_column_solve.py::test_the_wilson_column_in_a_flowsheet_reproduces_its_registered_root
      - doc:docs/derivations/S10-spec.md
      - doc:docs/s10-validation-report.md
      - doc:docs/derivations/S11-design.md §4.11
  - id: L-COL-1
    text: >-
      The column's feeds are single-phase and declared: one side feed per stage, none at a slot
      stage (S01 DECISION 8, S02 §1.4), and every side feed on its `feed` port shares one declared
      phase (the revision reader's one phase per port). A two-phase feed needs a flash and two
      stages.
    evidence:
      - tests/test_s11_column_unit.py::test_a26_each_structural_item_is_refused_at_bind
      - tests/test_s11_column_unit.py::test_evaluate_refuses_an_inlet_out_of_its_declared_phase
      - doc:docs/derivations/S02-spec.md
      - doc:docs/derivations/S11-design.md §4.11
  - id: L-COL-2
    text: >-
      The column has no side draws, pump-arounds, stage efficiencies or hydraulics, and is solved
      by S02's Newton method only: no inside-out or rate-based method (S02 §14).
    evidence:
      - doc:docs/derivations/S02-spec.md §14
      - doc:docs/derivations/S11-design.md §4.11
  - id: L-COL-3
    text: >-
      A total condenser gives saturated liquid (no subcooling); there is no total reboiler.
    evidence:
      - tests/test_s11_column_unit.py::test_a26_each_structural_item_is_refused_at_bind
      - doc:docs/derivations/S02-spec.md §1
      - doc:docs/derivations/S11-design.md §4.11
  - id: L-COL-4
    text: >-
      On `wilson-ig-v2` the column's end specifications are ratio, rate and duty only: a purity,
      recovery or temperature end is refused at binding (S10-C D8).
    evidence:
      - tests/test_s11_column_unit.py::test_a27_a_wilson_column_refuses_a_purity_end
      - doc:docs/derivations/S10C-design.md
      - doc:docs/derivations/S11-design.md §4.11
  - id: L-COL-5
    text: >-
      No uniqueness, multiplicity or feasibility claim for a column beyond S06 §14: a certificate
      holds at the converged state, and an inverse specification's feasibility is decided only on
      S06's registered band.
    evidence:
      - tests/test_s11_column_verifier.py::test_a35_the_syn001_column_certificates_verify
      - doc:docs/derivations/S06-spec.md §14
      - doc:docs/derivations/S11-design.md §4.11
  - id: L-COL-6
    text: >-
      In a flowsheet a purity end's tolerance acts on the mole fraction directly (`|x − x*|` ≤ the
      molar-flow tolerance ÷ 1 mol/s, the `F_ref` meaning); the standalone column's acts on `F·x`.
    evidence:
      - tests/test_s11_column_face.py::test_a20_the_q7_rows_vanish_at_the_standalone_root
      - doc:docs/derivations/S11-design.md §4.7.4
  - id: L-COL-7
    text: >-
      On `wilson-ig-v2` the column's Stage B (S08's block re-entry) is tested at the opening level
      only (S10-C).
    evidence:
      - doc:docs/derivations/S10C-spec.md
      - doc:docs/derivations/S11-design.md §4.11
  - id: L-COL-8
    text: >-
      SYN-001 columns are synthetic (L18): their results are verified, never validated.
    evidence:
      - tests/test_s11_column_solve.py::test_the_column_in_a_flowsheet_reproduces_its_registered_root
      - doc:docs/derivations/S11-design.md §4.11
  - id: L-COL-9
    text: >-
      In a flowsheet a column region has no edge-3 continuation (no revision region has one). The
      unit's own `evaluate` keeps S02's full standalone path, S08 Stage B included, so the
      traversal start is the standalone answer.
    evidence:
      - tests/test_s11_column_solve.py::test_a_revision_region_has_no_edge_3_continuation
      - tests/test_s11_column_unit.py::test_evaluate_is_the_standalone_solve
      - doc:docs/derivations/S11-design.md §10.8
  - id: L-COL-10
    text: >-
      A column under a PTC policy (`T08-ptc-v1`) ends `PTC_MAPPING_INVALID` before any attempt:
      the PTC mapping does not cover the column's stage variables.
    evidence:
      - tests/test_s11_column_solve.py::test_a_column_under_the_ptc_policy_is_refused_typed
      - doc:docs/S11B_DECISIONS.md

