      Acyclic flowsheets; recycles (single, nested, high-gain) by tear with safeguarded Anderson
      and restart, or merged to EO; EO regions; cross-unit specifications promoted to EO; exact
      zero-flow streams and components (ADR 0001 D3; the `ZERO_FLOW` regime). More than one loop
      or region per plan is not exercised by a registered case (L23).
    evidence:
