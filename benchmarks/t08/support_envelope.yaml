unsupported:
  - id: U01
    capability: Real components, or a component set that is not exactly a permutation of {A, B, C}
    outcome: >-
      `validate` INVALID with `COMP-03` FAIL naming the component (T06 A08); the bindings refuse
      `components_unsupported` (T06 A60).
    evidence:
      - tests/test_t06_w1b_order.py::test_a60_a_non_permutation_is_refused_by_both_bindings
      - tests/test_t05_w1b_revision.py::test_refusal[R2-components]
      - check:T06.A08

  - id: U02
    capability: Any property method other than SYN-001
    outcome: >-
      Not representable: a revision has no property-method member, so naming one is `SCHEMA-01`
      INVALID; a model of another package is `model_unsupported(<id>)` at binding.
    evidence:
      - tests/test_t08_w2_unsupported.py::test_u02_a_property_method_member_is_a_schema_refusal
      - tests/test_t08_w2_unsupported.py::test_u02_a_model_of_another_property_package_is_model_unsupported

  - id: U03
    capability: A state outside 280–440 K or 50–200 kPa
    outcome: >-
      `INITIALIZATION_FAILED` at the start (T06 A62); `invalid_trial_state` from the compiled
      residual inside a solve.
    evidence:
      - tests/test_t06_w11_initializer.py::test_a62_the_tear_path_returns_initialization_failed
      - tests/test_k01_syn001_conformance.py::test_a_state_outside_the_domain_is_reported_not_extrapolated
      - check:T06.A62

  - id: U04
    capability: A model id not in `MODEL_BUILDERS`
    outcome: The revision binder refuses `model_unsupported(<id>)`.
    evidence:
      - tests/test_t05_w1b_revision.py::test_refusal[builders]
      - tests/test_t07_w3f_tie_by_kind.py::test_q2_a2_an_unsupported_tie_reports_the_revision_binders_refusal

  - id: U05
    capability: >-
      `validate(task="optimization")`; any study — optimization, parametric sensitivities,
      sweeps, parameter estimation
    outcome: >-
      `validate` with `task: optimization` ends with ADR 0019's error `unsupported`, detail
      `task_unsupported(optimization)`, before any analysis; no v0.1 path returns
      `READY_FOR_OPTIMIZATION` (the value stays in the frozen enum, unused); the other studies
      have no operation among the twenty-one of `OPERATIONS`; no optimality claim anywhere.
    evidence:
      - tests/test_t08_w2_unsupported.py::test_u05_validate_for_optimization_is_unsupported
      - tests/test_t08_w2_unsupported.py::test_u05_a_change_for_optimization_is_refused_audited
      - doc:docs/blueprint-v3.1.md

  - id: U06
    capability: Dynamics; time-varying specifications as a solve
    outcome: Not representable (ADR 0008 D1); a profile value or a time member is `SCHEMA-01` INVALID.
    evidence:
      - tests/test_t08_w2_unsupported.py::test_u06_a_specification_profile_is_a_schema_refusal
      - tests/test_t08_w2_unsupported.py::test_u06_a_time_member_is_a_schema_refusal
      - doc:docs/adr/0008-transient-extension-readiness.md §D1

  - id: U07
    capability: PTC on a flowsheet whose `holdup_balance` rows lack a registered mapping entry
    outcome: >-
      `PTC_MAPPING_INVALID` with `ptc_mapping_invalid(<row>, missing)`. PTC is offered as
      `T08-ptc-v1` on flowsheets whose every `holdup_balance` row has a registered mapping entry
      (`tp_heater`, `tp_flash`, `kinetic_cstr`); T05 §12.4's refusal for T05 models is unchanged.
    evidence:
      - tests/test_t05_w12_discovery.py::test_ptc_over_a_t05_region_is_refused_before_any_call
      - tests/test_t05_w12_discovery.py::test_ptc_through_the_plan_ends_with_the_same_refusal
      - tests/test_t04_ptc_region.py::test_a14_an_invalid_mapping_is_refused_before_anything_runs
      - tests/test_t08_kinetic_cstr.py::test_b13_a_t05_holdup_row_beside_the_cstr_is_still_refused

  - id: U08
    capability: >-
      Resume, branches, in-band policy administration, MCP over HTTP, solve policies beyond the
      offered four
    outcome: >-
      R-110: a resume request is outside the job-operation enum and refused by the request schema;
      a change set naming a branch is refused by its schema; no operation administers policies
      and no HTTP route serves MCP; a registered policy that is not offered is `unsupported`, an
      unknown id `not_found`.
    evidence:
      - tests/test_t07_adr0008_jobs.py::test_c_an_operation_outside_the_enum_is_refused[solve_resume]
      - tests/test_t08_w2_unsupported.py::test_u08_a_change_set_naming_a_branch_is_refused_by_its_schema
