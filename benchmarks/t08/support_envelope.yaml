# The supported envelope (T08 release spec §5; T08 build-first spec §E.4, §E.5, B27). Since R-193
# (2026-10-08) this file is v0.2's working envelope, held to the live code during v0.2 development;
# the v0.1 envelope as released is `git show v0.1.1:benchmarks/t08/support_envelope.yaml`
# (`v0.1-envelope-1`, release 0.1.0). It is finalised for 0.2.0 at M07.
# Pinned at the alpha's candidate `C_α` as `v0.2-alpha-envelope-1`, release 0.2.0a1 (V02 alpha
# release spec MR-3); returned to the working form at the alpha's merge into `main` (R-460).
# Pinned at 0.2.0's cut commit K as `v0.2-envelope-1`, release 0.2.0 (M07 spec §7.2; alpha-main
# rulings O5); returned to the working form by the first D2.4 change after the tag (R-460, C7).
#
# Machine-readable source of `docs/support-matrix.md`, which `scripts/t08_support_matrix.py --emit`
# renders and `--check` holds to this file byte for byte (T08.A23). `--check` also compares the
# enumerated axes with the code (T08.A20), requires every `unsupported` row to name a typed outcome
# and test nodes that collect (T08.A22; `tests/test_t08_w2_support_envelope.py` runs them), and
# checks the harvest (T08.A21).
#
# Unlisted is unsupported (blueprint §2.2). Evidence strings take three forms: a pytest node id
# (`tests/<file>.py::<test>[<param>]`), a manifest check id (`check:<id>`, which must exist with
# result `pass` in a manifest under `evidence/`), or a document (`doc:<path>` and an optional
# ` §<section>`; the path must exist).
#
# Build-lane notes (T08 W2.1), for the design-lane review:
# - L10 is the seed row restated: T08-warm-v1 built compatible warm starts (B40–B49), so "no warm
#   starts across runs" is no longer true; the GUESS-role half stands.
# - L18 onward are rows the harvest (W2.2) needed that §5.5's seed does not carry.

envelope_id: v0.2-envelope-dev
release: 0.2.0.dev0

axes:
  - id: property_model
    title: Property model
    statement: >-
      SYN-001 for every revision, unit model and operation: ideal vapour, incompressible ideal
      liquid, VLE; reference convention SYN-001-ref-v1 (a formation datum, ADR 0011 D2); no
      critical region, no extra phase. Since M02 the C1 models (`c1.*`) bind `pr-c1-v1` on their
      own basis (R-288). Since S11 a revision's `record_source` selects one of five bases (ADR
      0050, R-810): SYN-001, C1, IAPWS-95, CoolProp HEOS (one fluid) or Wilson's records, each
      with its own components, domain and limitation row; any other value selects SYN-001.
    providers: [coolprop-heos-v1, iapws95-v1, pr-c1-v1, syn001, wilson-ig-v2]
    #: Shipped providers that bind on a basis other than syn001's (R-288's `MODEL_BASES`); each
    #: has its own components, domain and limitation row; the components and domain axes below
    #: are syn001's.
    other_basis_providers:
      - id: pr-c1-v1
        limitation: L42
        caveat: >-
          its own components (H2, N2, NH3, Ar, CH4) and domain (200–1000 K, 10⁴–3 × 10⁷ Pa),
          validated for pure-component behaviour only, no mixture VLE validation, k_ij = 0
      - id: iapws95-v1
        limitation: L-S11-1
        caveat: >-
          its own component (H2O) and domain (273.16–1273.15 K, 10²–10⁸ Pa), the routing models
          only, and S05's validation
      - id: coolprop-heos-v1
        limitation: L-S11-2
        caveat: >-
          one fluid per revision among 123, S07's tiers and per-fluid domains, the routing models
          only, and the `coolprop` extra installed
      - id: wilson-ig-v2
        limitation: L-S11-3
        caveat: >-
          its own three components (CH3OH, C2H5OH, H2O; records in the source repository only)
          and domain (300–400 K, 30–200 kPa), the routing models only, premises P1–P3 checked at
          binding, and S10's VAL-1–3 bands
    reference_convention: SYN-001-ref-v1
    evidence:
      - check:T05.A23
      - check:K02.identity.property_package
      - doc:docs/derivations/SYN-001.md
      - doc:docs/adr/0011-unit-models-ph-closure-and-reaction-datum.md §D2
      - doc:docs/adr/0026-c1-peng-robinson-vapour-only-route.md §D6
      - tests/test_m01_provider.py::test_a04_describe_declares_exactly_the_registered_surface
      - tests/test_s11_bases.py::test_a01_the_selectable_bases_are_the_127_in_order
      - doc:docs/adr/0050-s11-binding-package.md

  - id: components
    title: Components
    statement: >-
      Exactly the three SYN-001 pseudo-components A, B, C, declared in any of the six orders and
      mapped onto the provider's order at binding (T06 A59–A61); a proper subset, an extra or a
      repeated component is refused `components_unsupported`. A mixture without one of them is
      declared with all three and that component's flows exactly zero (ADR 0001 D3). Synthetic:
      no real chemical identity.
    members: [A, B, C]
    evidence:
      - tests/test_t06_w1b_order.py::test_every_permutation_maps_to_the_providers_order
      - tests/test_t06_w1b_order.py::test_a60_a_non_permutation_is_refused_by_both_bindings
      - check:T06.A59
      - check:T06.A60
      - check:T06.A61

  - id: domain
    title: Domain
    statement: 280–440 K and 50–200 kPa, inclusive (the provider's predicate).
    temperature_K: [280.0, 440.0]
    pressure_Pa: [50000.0, 200000.0]
