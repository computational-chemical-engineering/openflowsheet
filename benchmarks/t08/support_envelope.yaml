limitations:
  - id: L01
    text: >-
      PTC is experimental: selectable by explicit policy only (`T08-ptc-v1`); no qualified family.
      V14 clause (b) is carried as FAIL (ADR 0021 D3; on PTC-R1, PTC ends at the saddle from 149
      starts).
    evidence:
      - doc:docs/derivations/T04-globalization-spec.md §8
      - doc:docs/adr/0010-globalization-homotopy-ptc.md
      - doc:docs/reviews/T08-verdict-V14b.md
      - doc:docs/adr/0021-v0.1-release-policy.md §D3
  - id: L02
    text: >-
      A zero-duty lifted flash whose root lies exactly on its dew or bubble point is `UNVERIFIED`,
      `RANK_DEFICIENT`; nearby two-phase-attempt stops are caught `FAILED(false_success_detected)`.
    evidence:
      - doc:docs/derivations/T05b-limitations-spec.md §17
      - check:T06.A07
      - check:T06.A92
  - id: L03
    text: >-
      The alias-pressure-shift limit: the pressure column at 0-based position j is certifiable iff
      997 (j + 1) <= max(200 000 - P, P - 50 000) Pa; beyond it the alias certificates are
      `unsupported(pressure_shift_outside_domain)` and the verdict `UNVERIFIED` (spec §5.4).
    evidence:
      - tests/test_t08_w2_alias_threshold.py::test_a24_one_pressure_column_at_the_threshold_positions
      - doc:docs/adr/0014-t06-corpus-ensemble-and-reference-policy.md §D5
      - doc:docs/derivations/T06-corpus-spec.md §8.2
  - id: L04
    text: >-
      A saturation-closure failure inside the rows' own window is `FAILED`, where
      `UNVERIFIED(label_not_demonstrated)` would be exact (conservative).
    evidence:
      - doc:docs/derivations/T06-corpus-spec.md §16
  - id: L05
    text: >-
      `VERIFIED` certifies residuals at registered tolerances; the solution-error bound is
      recorded, not promised.
    evidence:
      - doc:docs/adr/0007-reproducibility-certificate-policy.md §F3
  - id: L06
    text: Energy checks share the property provider with the solver ([A09]).
    evidence:
      - check:T06.A33
      - doc:docs/derivations/K04-certificate-spec.md
  - id: L07
    text: >-
      Bitwise float reproduction is reported, never promised; per-start ensemble outcomes differ
      across architectures. LU pivot-path diagnostics (`u_diag_min_abs`, `u_diag_max_abs`,
      `u_diagonal_ratio`, `nnz_L`, `nnz_U`) are recorded and not compared across platforms (ADR
      0025 D4).
    evidence:
      - doc:docs/adr/0007-reproducibility-certificate-policy.md §F1
      - check:T06.A35
  - id: L08
    text: >-
      Property-call counts are within-platform diagnostics; the terminal-refinement core (ADR 0018) can exhaust the
      property budget where `newton` finishes.
    evidence:
      - doc:docs/adr/0007-reproducibility-certificate-policy.md §D5
      - doc:docs/adr/0018-newton-terminal-refinement.md §D4′
  - id: L09
    text: The robustness claim is the nominal profile only; the stress profiles were not run.
    evidence:
      - doc:docs/derivations/T06-corpus-spec.md §6.7
  - id: L10
    text: >-
      The initializer chain is partial (blueprint §7.4, K03 §10.1): GUESS-role specifications are
      not bound by the revision binder (such revisions run on `legacy_eo`), the SYN-001 tear path
      has its registered initializer only, and the one fallback between initializer sources is
      `T08-warm-v1`'s compatible warm start → traversal (opt-in; L-WS-1, L-WS-2).
    evidence:
      - doc:docs/derivations/T03-phase-controller-spec.md §13
      - doc:docs/derivations/K03-solver-spec.md §10.1
      - check:K03.initializer_chain
      - doc:docs/derivations/T08-build-first-spec.md §B4
      - doc:docs/adr/0024-compatible-warm-starts.md
  - id: L11
    text: >-
      Cancellation: `verify` has no cooperative checkpoint; a region's events are lost on
      interrupt.
    evidence:
      - doc:docs/T07_DECISIONS.md
  - id: L12
    text: >-
      Agent evidence: one pinned model and configuration, MCP only, not out of sample (CP lower
      bound 0.681); T09 0/6, T10 1/3; INJ-4 never exposed.
    evidence:
      - doc:docs/reviews/T07-verdicts.md
  - id: L13
    text: "`worker.log` is readable through `get_artifact`."
    evidence:
      - doc:docs/T07_DECISIONS.md
  - id: L14
    text: The v0.1 rank rule is exactly one freed column per promoted target.
    evidence:
      - doc:docs/derivations/T02-recycle-spec.md §7.1
      - tests/test_t07_r7_admission.py::test_a_route_bound_without_admission_ends_typed_at_plan_time
  - id: L15
    text: Linux x86-64 and aarch64 only; Python 3.13; the one lock.
    evidence:
      - doc:.github/workflows/ci.yml
      - check:K05.G05.two_platform_structural_equality
  - id: L16
    text: IDAES agreement holds at the registered near-sharp SmoothVLE ε only.
    evidence:
      - check:T06.A83
  - id: L17
    text: The reference environment's DWSIM runs on .NET 8, end of life 2026-11-10.
    evidence:
      - doc:docs/reference-environments.md
  - id: L-CSTR-1
    text: >-
      The kinetic CSTR's rate law and coolant model are synthetic (the Frank-Kamenetskii γ → ∞
      form and a coolant capacity rate); no Arrhenius or physical-conductance claim is made.
    evidence:
      - doc:docs/derivations/T08-build-first-spec.md §A1.1
      - doc:docs/adr/0023-kinetic-cstr-and-ptc-r1.md
  - id: L-CSTR-2
    text: >-
      An adiabatic, dormant kinetic CSTR's outlet temperature is a singularity (T05 §4.7 (a));
      v0.1 does not certify an EO solve in which it appears.
    evidence:
      - tests/test_t08_kinetic_cstr.py::test_b16_an_adiabatic_dormant_outlet_is_labelled_with_the_inlet_and_is_singular
      - doc:docs/derivations/T08-build-first-spec.md §A1.4
  - id: L-CSTR-3
    text: >-
      The kinetic CSTR's causal evaluator is a local model initializer (the isothermal state at
      `T_init`), not a steady state.
    evidence:
      - tests/test_t08_kinetic_cstr.py::test_b18_the_initializer_at_the_ptc_r1_feed
      - doc:docs/derivations/T08-build-first-spec.md §A1.4
  - id: L-WS-1
    text: >-
      Warm-start compatibility is exact id-set identity; a topology edit is a typed rejection to
      the next source, not a partial or adapted match.
    evidence:
      - tests/test_t08_w4_warm_starts.py::test_b43_an_incompatible_candidate_is_rejected_to_the_traversal
      - doc:docs/adr/0024-compatible-warm-starts.md
  - id: L-WS-2
    text: >-
      The warm-start source is chosen automatically (the lineage's latest VERIFIED state) under
      an opt-in policy only; no request-named source exists in v0.1 (v0.2, M03).
    evidence:
      - tests/test_t08_w4_warm_starts.py::test_b48_the_latest_verified_state_of_the_lineage_is_selected
      - doc:docs/adr/0024-compatible-warm-starts.md
  - id: L18
    text: >-
      Nothing in v0.1 is empirically validated: SYN-001 is synthetic (pseudo-components, invented
      constants, ideal VLE), and every result is numerical verification against the same equations.
    evidence:
      - doc:docs/derivations/T08-release-spec.md §3.3
  - id: L19
    text: >-
      Certificates are local: the regularity screen and the error bound hold at the certified state
      only. No root completeness, uniqueness, thermodynamic stability beyond the admissibility
      check, or dynamic stability is assessed (`claims` stay NOT_ASSESSED).
    evidence:
      - check:T03.A21
      - doc:docs/derivations/T06-corpus-spec.md §15
  - id: L20
    text: >-
      Convergence is not guaranteed wherever a root exists: registered counterexamples end typed
      (PHS-05 without edge 3; HOM-03/HOM-04 stall at a phase boundary); folds are not followed
      (no arclength continuation).
    evidence:
      - check:T03.A12
      - check:T04.A06
      - check:T04.A07
  - id: L21
    text: >-
      Specification continuation (edge 3's homotopy) exists only for regions with a promoted
      specification; elsewhere it is `unsupported(no_continuation_parameter)`.
    evidence:
      - doc:docs/derivations/T04-globalization-spec.md §14
  - id: L22
    text: >-
      Scope of the solver evidence: tear selection is greedy (minimality not claimed); behaviour
      finer than the registered basin margins and trajectories below a residual of 1e-6 are not
      established; several stated rules are exercised only by synthetic fixtures.
    evidence:
      - doc:docs/derivations/T02-recycle-spec.md §12
      - doc:docs/derivations/T03-phase-controller-spec.md §13
  - id: L36
    text: >-
      No performance claim at size: costs are within-platform measurements on registered cases of
      at most tens of variables; compiles per plan run and the regularity screen's cost at size
      are not measured.
    evidence:
      - doc:docs/derivations/T02-recycle-spec.md §12
      - doc:docs/derivations/T03-phase-controller-spec.md §13
      - doc:docs/derivations/T06-corpus-spec.md §15
  - id: L37
    text: >-
      `verify` is not safe to run concurrently in threads of one process: the regularity screen
      seeds and restores numpy's global generator around `onenormest` (T06 §8.1, R-069), so
      concurrent calls can move the estimate, `rcond₁`, the bound and a regularity verdict near
      its threshold; jobs run in separate processes and are unaffected.
    evidence:
      - doc:docs/derivations/T06-corpus-spec.md §16
  - id: L38
    text: >-
      Structural analysis is generic: validation's STR checks and `inspect_structure` report
      structural rank and the DM/BTF partition only; numerical rank, conditioning and feasibility
      are judged by the certificate's regularity screen at a converged state (blueprint D05).
    evidence:
      - doc:docs/derivations/T01-structural-spec.md
  - id: L39
    text: >-
      The structural-zero release (recovery edge E5) leaves no trace record: a trace does not
      show that it ran.
    evidence:
      - doc:docs/recovery-edges.yaml §E5
  - id: L23
    text: >-
      More than one recycle loop or region per plan is not exercised by any registered flowsheet;
      the plan builder's single-loop reading is to be revisited when one is (T02 review N8).
    evidence:
      - doc:docs/reviews/T02-review.md
  - id: L24
    text: >-
      Not implemented: Wegstein and Aitken acceleration, trust regions, Krylov linear solves,
      arclength continuation.
    evidence:
      - doc:docs/derivations/T02-recycle-spec.md §12
      - doc:docs/derivations/T04-globalization-spec.md §14
  - id: L25
    text: >-
      Alias certificates cover pressure and temperature copies only (the kinds ADR 0001 D6 gives a
      tolerance); any other affine redundancy is `uncertified_affine`, retained and listed.
    evidence:
      - check:T01.A19
  - id: L26
    text: >-
      SYN-001's symmetric data leave paths unexercised: component discrimination in liquid
      enthalpy, a liquid heat of reaction (every liquid reaction is thermoneutral), an exchanger
      with a phase change or temperature-dependent c_p (refused).
    evidence:
      - doc:docs/derivations/T05-unit-models-spec.md §18
  - id: L27
    text: >-
      An EO solve with a dormant PH-type outlet is never certified (UNVERIFIED, RANK_DEFICIENT;
      T05 §4.7 (a), R-050).
    evidence:
      - check:T05.A28
  - id: L28
    text: >-
      A single flowing component inside its latent jump is solved causally only; on the EO path
      it ends typed or not VERIFIED, never VERIFIED (T05 §4.7 (b), R-050).
    evidence:
      - doc:docs/derivations/T05-unit-models-spec.md §4.7
  - id: L29
    text: >-
      The PH kernel's accuracy for near-pure feeds is the energy tolerance's resolution; a target
      inside the latent jump may be refused `ph_ill_conditioned` (T05 §4.4, R-049).
    evidence:
      - check:T05.A29
  - id: L30
    text: >-
      Degenerate specifications are reported, not certified: a TP outlet of one component at
      exactly T_sat, conditioning near β → 0 or 1, and a zero-flow SPECIFICATION_CONFLICT (not
      searched past); a dormant exchanger side gets no second-law judgement.
    evidence:
      - doc:docs/derivations/T05b-limitations-spec.md §17
  - id: L31
    text: >-
      A state whose verifier projection is refused is judged at its final state: a possible false
      alarm, never a false pass.
    evidence:
      - doc:docs/derivations/K04-F9-spec.md §11
  - id: L32
    text: >-
      The ensemble gate's run 2 is not out of sample for `T06-revision-v2` (its last change was
      informed by these draws); the holdout (436 of 440 on every class) is the out-of-sample
      estimate.
    evidence:
      - doc:docs/reviews/T06-verdicts.md
  - id: L33
    text: >-
      Scope defaults of T06 §16: results are keyed by component id; a TWO_PHASE split with a
      vanishing phase is not converted by the solver (the verifier catches the label); three
      F-BUDGET starts have no cost remedy.
    evidence:
      - doc:docs/derivations/T06-corpus-spec.md §16
  - id: L34
    text: >-
      A replay bundle references the CasADi wheel by hash and does not embed it; a replay needs the
      wheel to remain fetchable.
    evidence:
      - doc:docs/adr/0006-distribution-data-rights.md §D1
  - id: L35
    text: >-
      A tear-path solve that exhausts its budget records `attempts = 0`, the start state and no
      provenance (K03's registered capped-budget shape).
    evidence:
      - doc:docs/derivations/T03-phase-controller-spec.md §13
  - id: L40
    text: >-
      The reference-tool data (the IDAES and DWSIM environments, their downloads and their
      outputs) and OpenIDAES-450 are not distributed: the sdist and the wheel carry the project's
      own code, its package data (since M01 including the five C1 records, M01 spec §15 Q-N4's
      default) and its licence files only, and every ComponentRecord is synthetic (SYN-001) or
      one of M01's five real C1 records, each with its identifiers, rights,
      per-parameter provenance and retrieval equality (M01 spec §3.5, R-158).
    evidence:
      - tests/test_t08_w2_inventory.py::test_a32_no_third_party_data_in_the_sdist_or_the_wheel
      - tests/test_t08_w2_inventory.py::test_a32_every_component_record_is_synthetic_or_a_vetted_m01_record_with_rights
      - doc:docs/adr/0006-distribution-data-rights.md §D1
  - id: L41
    text: >-
      A bundle written by an installed package (wheel or sdist, not the source checkout) carries no
      dependency-set identity: the package ships no lock file, so its `lock_sha256` is empty and
      every replay of it is `inspected_archived_results` / `NOT_RUN` ("the dependency set is
      unknown …"); replayable bundles are written from the source checkout at the lock
      `ead4edf1…`.
    evidence:
      - tests/test_t08_r3_a19_lock_lookup.py::test_the_three_states_end_to_end
      - tests/test_t08_r3_a19_lock_lookup.py::test_b_an_installed_layout_beneath_a_stray_lock_has_none
      - doc:docs/adr/0007-reproducibility-certificate-policy.md §D4
      - doc:docs/derivations/T08-release-spec.md §5.5
  - id: L42
    text: >-
      `pr-c1-v1` (Peng–Robinson with the light gases vapour-only, ADR 0026), shipped since M01, is
      bound by no model of `MODEL_BUILDERS` yet (M02 adds its units) and does not share the axes'
      components and domain: it takes the five real components H2, N2, NH3, Ar, CH4 (the only
      liquid is pure NH3) over 200–1000 K and 10⁴–3 × 10⁷ Pa. It is validated for pure-component
      behaviour only, within M01 spec §11's bands (NH3 saturation pressure within 2 %, liquid NH3
      and light-gas ln φ within 0.05 of the reference equations of state). There is no mixture
      VLE validation, and k_ij = 0 for every pair: k_H2–NH3 = 0.1 would move the separator's
      vapour NH3 fraction y* by −3.1 % (about 3 % per 0.1; spec §4.2).
    evidence:
      - check:M01.A38
      - check:M01.A39
      - check:M01.A40
      - doc:docs/derivations/M01-spec.md §11
      - doc:docs/derivations/M01-spec.md §4.2
      - doc:docs/derivations/M01-spec.md §17
      - tests/test_m01_provider.py::test_a04_describe_declares_exactly_the_registered_surface
  - id: L-WEB-1
    text: >-
      The web shell (`serve-http --ui`) is a diagnostic client of the HTTP binding: it edits
      nothing (Solve and Cancel are its only effects), calls seventeen operations and no other,
      computes only display arithmetic (design note §5.6), converts no unit, and judges nothing —
      the scenario view displays run differences without a registered comparison or allowance.
    evidence:
      - tests/test_m06_static_scan.py::test_the_ui_calls_exactly_the_seventeen_operations
      - doc:docs/web-shell.md
      - doc:docs/design/M06-web-shell.md §5.6
  - id: L-WEB-2
    text: >-
      The web shell's security is the local, single-user model: loopback by default, the bearer
      token on every data request, a strict Content-Security-Policy; no TLS, no multi-user
      hosting, and no security assessment beyond design note §7. Served with `--allow-remote`
      over plain HTTP the page is an insecure context and record digests show "unchecked".
    evidence:
      - tests/test_m06_wo4_serving.py::test_a_shell_file_is_served_with_its_type_and_the_shell_headers
      - doc:docs/design/M06-web-shell.md §7
  - id: L-WEB-3
    text: >-
      The web shell is tested in headless Chromium only. No usability, workflow or screen-reader
      study exists; accessibility is limited to status shown as glyph and word, controls that are
      keyboard-reachable by construction, and the measured contrast of its colour tokens.
    evidence:
      - tests/test_m06_contrast.py::test_every_text_token_on_every_background_is_legible
      - doc:docs/design/M06-web-shell.md §13
  - id: L-WEB-4
    text: >-
      The agent history shows what the project recorded, not what an agent claimed; the
      validation shown beside a commit is recomputed now by the current server, not the report the
      agent received at commit time.
    evidence:
      - doc:docs/web-shell.md
      - doc:docs/design/M06-web-shell.md §12

