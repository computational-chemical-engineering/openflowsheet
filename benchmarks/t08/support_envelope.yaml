      - tests/test_t07_b3_policies.py::test_an_unknown_policy_stays_not_found
      - doc:docs/decision-register.md §R-110

  - id: U09
    capability: Second-order derivatives through the property callback
    outcome: The Hessian is reported `absent` and its call raises; never zeros (K01).
    evidence:
      - tests/test_k01_compiler.py::test_the_hessian_is_reported_absent_and_raises_rather_than_returning_zeros
      - check:K01.D5.4.second_order

  - id: U10
    capability: Gauge pressure; unregistered unit spellings
    outcome: Refused, typed, through the pure conversion, `validate()` and both bindings (T06 A68).
    evidence:
      - tests/test_t06_w12_units_v2.py::test_a68_every_registered_refusal_in_the_pure_function[1.0-barg-pressure-state.P-None]
      - tests/test_t06_w12_units_v2.py::test_a68_every_registered_refusal_in_the_pure_function[14.7-psig-pressure-state.P-None]
      - tests/test_t06_w12_units_v2.py::test_a68_every_registered_refusal_in_the_pure_function[26.85-degc-temperature-state.T-None]
      - check:T06.A68

  - id: U11
    capability: A region needing EO derivatives a unit lacks
    outcome: The plan is refused and the solve ends `CAPABILITY_UNAVAILABLE` naming the unit (T02 A27).
    evidence:
      - tests/test_t02_a02.py::test_a27_cap_1_the_plan_is_refused_and_no_loop_is_built_in_its_place
      - check:T02.A27

  - id: U12
    capability: A specification pairing other than one freed column per promoted target
    outcome: >-
      `UNSUPPORTED_RANK_STRUCTURE` at plan construction; through the application
      `plan_refused(UNSUPPORTED_RANK_STRUCTURE)`, a typed `unsupported` end (T07 rf6).
    evidence:
