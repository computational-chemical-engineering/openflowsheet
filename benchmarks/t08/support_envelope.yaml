  - id: external_execution
    title: External model execution
    statement: >-
      Since M02, a variant-backed model (`c1.reactor`) runs out of process under the isolation
      profile `external-subprocess-v1` (ADR 0033 D2): a separate interpreter and dependencies, a
      separate address space, an environment allowlist, a private working directory, one thread, a
      wall-clock limit, termination on cancel, forced kill and parent death, output from one
      validated file, and verified code identity. It is **not a sandbox**: no filesystem
      confinement, network isolation, memory or CPU quota, or syscall filtering; trust rests on
      provenance. Linux is registered; macOS best effort; Windows is refused before spawn. The
      reactor needs the separately built, pinned reactor environment, and a run that used it is
      R3 (ADR 0034 D6).
    evidence:
      - doc:docs/adr/0033-external-model-execution-and-experiment-records.md §D2
