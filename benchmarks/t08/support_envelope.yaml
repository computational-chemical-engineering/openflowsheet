      since S11 the column `syn001.column`, on SYN-001's and `wilson-ig-v2`'s bases (L-S11-3); and
      since M02's join (R-280) the eight C1 models and since W27 Amendment 3 (R-301) M04's
      `c1.reactor_surrogate`, on the `pr-c1-v1` basis only (R-288). `c1.reactor_standin` is
      synthetic only: the stand-in for the C1 reactor (ADR 0034 D9), labelled synthetic in its
      manifest and in every result's identity (R-199, R-231). No promotable surrogate of the real
      C1 reactor exists in v0.2 (L49, R-365). A cooler is the TP heater with negative duty (ADR 0001's sign convention).
