      - check:T06.A62

  - id: unit_models
    title: Unit models
    statement: >-
      The twenty-one models of `MODEL_BUILDERS`, each with its registered limitations (L02,
      L27–L31, L-CSTR-1..3): SYN-001's thirteen, on SYN-001's basis only, and since M02's join
      (R-280) the eight C1 models, on the `pr-c1-v1` basis only (R-288). `c1.reactor_standin` is
      synthetic only: the stand-in for the C1 reactor (ADR 0034 D9), labelled synthetic in its
      manifest and in every result's identity (R-199, R-231). A cooler is the TP heater with negative duty (ADR 0001's sign convention).
    members:
