title: 'SYN-001-UL-C3: a thermally coupled recycle (exchanger, PH flash).'
description: Feed -> exchanger cold side -> mixer with the liquid recycle -> PH flash (48 000 W) -> vapour
  product and liquid -> splitter (r = 0.6) -> recycle and purge -> exchanger hot side (310 K) -> sink.
  T05 spec §11.3 (the NET-07 candidate); expected values in benchmarks/t05/reference_values.yaml coupled_cases.SYN-001-UL-C3.
