# A49 expectation (E01 design §10.10.5.7, §10.10.6; Amendment 1 to ruling B, R-895…R-899).
#
# The 3rd-edition numbers that the shipped set `sslw-idaes-v1` corresponds to, typed from the pages
# of design §10.10.1 in Seider, Seader, Lewin, Widagdo, Product and Process Design Principles:
# Synthesis, Analysis, and Evaluation, 3rd ed. (Wiley, 2009), ch. 22 (printed pages). Individual
# numbers only, each with its page and equation or table; no book text or table is reproduced.
# Book values are strings so that their printed decimals and signs are kept. Typed from the book,
# never from the set file; the two meet only in tests/test_e01_b_seider3.py.
#
# A record names the set path (entry id + the path as ResolvedEntry.amended writes it; entry `set`
# is the set's own `basis`), the book value, the page (a string: "571", or "563-564" for a span),
# the equation, table or example, and a relation (v the set's value):
#   same         Decimal(v)*sign == Decimal(book); `sign` (default +1) is the sign the form
#                applies to v, so a coefficient printed "- 0.8709" is book "-0.8709" with sign -1
#   shift        Decimal(v) - Decimal(book) == 0.2382 (the four exchanger alpha1; design §10.10 G2)
#   amended      Decimal(v)*sign == Decimal(book); v.amended.replaces == `replaces` (IDAES's value,
#                SSLW.py) and v.amended.citation names the page
#   basis        the entry's effective index_basis == book == 500 (the book's stated CE), with
#                amended.replaces == `replaces` (394, IDAES's USD_CE394)
#   not_in_book  IDAES's own number (design §10.10 G11); `reason` says why
# Ranges compare by exact equality of min and max with the book's printed bounds; a primary range's
# citation names the page. `min_is_switch`: the min is IDAES's switch between two pieces, not a
# printed bound; it lies at or above the book's min and equals the previous piece's max.
citation: "Seider, Seader, Lewin, Widagdo, Product and Process Design Principles: Synthesis, Analysis, and Evaluation, 3rd ed. (Wiley, 2009), ch. 22"
book_index: 500.0
shift: "0.2382"
records:
  # Set basis: every §22.5 correlation used is stated at 2006, CE = 500 (first at p. 561)
  - {entry: set, path: basis.index.value, relation: same, book: "500", page: "561", eq: "Eq. (22.14)"}

