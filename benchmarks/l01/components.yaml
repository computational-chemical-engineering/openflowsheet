# L01 component records: the library route pr-lib-v1, vapour only (ADR 0043, register R-520..R-527).
#
# Normative text: docs/derivations/L01-spec.md section 4.1 (records and sources), ADR 0043 D3 and D6,
# and ADR 0026 D5. Nine records in this identity order: H2, N2, Ar, CH4 copied verbatim from
# benchmarks/m01/components.yaml (one datum per substance, L01.A02; NH3 is not copied), then H2O, CO2,
# O2, C2H6, C3H8. Every value is a published value recorded with its primary reference (Frank,
# 2026-10-02, dossier statement 1). Retrieval tools: chemicals 1.5.2 (critical constants, acentric
# factors, formation enthalpies, identifiers, molecular weights) and Cantera 3.2.0 (nasa_gas.yaml, the
# NASA-7 heat capacities). Every retrieved value is re-derived, and every new value cross-checked
# against CoolProp 8.0.0, by benchmarks/l01/components_crosscheck.py, whose record
# benchmarks/l01/components-crosscheck.json states every deviation. The group's reactor property
# database is not used.
#
# Ideal-gas heat capacity: c_p^ig/R = sum_k b_k (T / 1000 K)^k, k = 0..4, R = 8.31446261815324 J/(mol K)
# (exact SI). b_k = a_(k+1) * 1000^k exactly in decimal, where a_1..a_5 are the low-range (200-1000 K)
# NASA-7 coefficients of McBride, Gordon and Reno (1993); the scaling makes each b_k dimensionless.
# Formation enthalpies: ideal gas at 298.15 K, ATcT 1.112; elements in their reference state are zero by
# definition. Together they are the datum of the reference convention PR-C1-ref-v1 (ADR 0026 D4), shared
# with pr-c1-v1 (ADR 0043 D4).

