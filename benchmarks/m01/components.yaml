# M01 component records: the five components of C1, the ammonia synthesis loop (ADR 0022, R-120, R-145).
#
# Normative text: docs/derivations/M01-spec.md section 3 (records and sources) and ADR 0026 D5.
# Every value is a published value recorded with its primary reference (Frank, 2026-10-02, dossier
# statement 1). Retrieval tools: chemicals 1.5.2 (critical constants, acentric factors, formation
# enthalpies, identifiers, molecular weights) and Cantera 3.2.0 (nasa_gas.yaml, the NASA-7 heat
# capacities). Cross-checked against CoolProp 8.0.0 by benchmarks/m01/components_crosscheck.py, whose
# record benchmarks/m01/components-crosscheck.json states every deviation. The group's reactor property
# database is a cross-check only (Frank, 2026-10-02); none of its values is used here.
#
# Ideal-gas heat capacity: c_p^ig/R = sum_k b_k (T / 1000 K)^k, k = 0..4, R = 8.31446261815324 J/(mol K)
# (exact SI). b_k = a_(k+1) * 1000^k exactly in decimal, where a_1..a_5 are the low-range (200-1000 K)
# NASA-7 coefficients of McBride, Gordon and Reno (1993); the scaling makes each b_k dimensionless.
# Formation enthalpies: ideal gas at 298.15 K, ATcT 1.112; elements in their reference state are zero by
# definition. Together they are the datum of the reference convention PR-C1-ref-v1 (ADR 0026 D4).

