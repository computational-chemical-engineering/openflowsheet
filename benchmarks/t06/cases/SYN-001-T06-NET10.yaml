title: 'SYN-001-T06-NET10: vapour-side (condensate) recycle across two equilibrium stages.'
description: Feed (1, 1, 1) mol/s -> mixer -> TP flash 1 (360 K, P_r); its vapour -> cooler (340 K) ->
  TP flash 2 (340 K, P_r); flash-2 liquid -> splitter (r = 0.6) back to the mixer and to a purge sink;
  flash-1 liquid and flash-2 vapour are products. T06 spec §4.3 (corpus NET-10); expected values in benchmarks/t06/reference_values.yaml
  closed_form.corpus_cases.SYN-001-T06-NET10.
