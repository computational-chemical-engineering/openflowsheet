title: 'SYN-001-T06-NET03: nested recycle (an inner liquid loop inside an outer condensate loop).'
description: Feed -> mixer 1 -> mixer 2 -> heater (358 K) -> PH flash (20 000 W); flash liquid -> splitter
  (r = 0.5) back to mixer 2 and to a purge sink; flash vapour -> cooler (340 K) -> TP flash (340 K, P_r)
  whose liquid returns to mixer 1 and whose vapour is a product. T06 spec §4.3 (corpus NET-03); expected
  values in benchmarks/t06/reference_values.yaml closed_form.corpus_cases.SYN-001-T06-NET03.
