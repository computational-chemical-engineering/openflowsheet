<!doctype html>

     every /ui response forbids both. Everything the page shows comes from the application
     contract through js/api.js. -->
<html lang="en" data-ofs-ready="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>OpenFlowsheet</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<header id="ofs-header"></header>
<main id="ofs-main"><noscript>The OpenFlowsheet web shell needs JavaScript.</noscript></main>
</body>
</html>
